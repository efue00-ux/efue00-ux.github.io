<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#02040a;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:10;

  display:flex;

  align-items:center;

  justify-content:center;

  background:radial-gradient(circle,#172b49,#02040a 75%);

}

.box{

  width:88%;

  max-width:460px;

  padding:30px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:24px;

  background:#030817ee;

  box-shadow:0 0 40px #00eaff55;

}

h1{

  color:white;

  font-size:44px;

  line-height:.95;

  letter-spacing:4px;

  text-shadow:0 0 20px #00eaff;

}

.sub{

  color:#00eaff;

  margin:15px 0 25px;

  letter-spacing:5px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:14px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

}

#hud{

  display:none;

  position:fixed;

  z-index:5;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  pointer-events:none;

  color:white;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:140px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#ff3972;

}

#controls{

  display:none;

  position:fixed;

  z-index:6;

  inset:0;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:68px;

  height:68px;

  border-radius:50%;

  border:2px solid #ffffff33;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:bold;

  pointer-events:auto;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:95px;

  bottom:18px;

}

#jump{

  right:100px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:15px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:58px;

  bottom:96px;

  width:54px;

  height:54px;

  font-size:11px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:7;

  right:15px;

  bottom:170px;

  gap:7px;

}

.skill{

  width:58px;

  height:43px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:9px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

/* =========================

   IMAGE

========================= */

const characterImage=new Image();

characterImage.src="character.png";

let imageLoaded=false;

characterImage.onload=function(){

  imageLoaded=true;

};

/* =========================

   INPUT

========================= */

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

function bindButton(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{

    e.preventDefault();

    keys[key]=true;

  });

  b.addEventListener("pointerup",e=>{

    e.preventDefault();

    keys[key]=false;

  });

  b.addEventListener("pointercancel",()=>{

    keys[key]=false;

  });

  b.addEventListener("pointerleave",()=>{

    keys[key]=false;

  });

}

bindButton("left","left");

bindButton("right","right");

bindButton("jump","jump");

bindButton("attack","attack");

bindButton("dash","dash");

addEventListener("keydown",e=>{

  if(e.code==="ArrowLeft")keys.left=true;

  if(e.code==="ArrowRight")keys.right=true;

  if(e.code==="ArrowUp" || e.code==="Space"){

    if(!keys.jump){

      jump();

    }

    keys.jump=true;

  }

  if(e.code==="KeyJ")keys.attack=true;

  if(e.code==="ShiftLeft")keys.dash=true;

  if(e.code==="Digit1")slash();

  if(e.code==="Digit2")shuriken();

  if(e.code==="Digit3")ultimate();

});

addEventListener("keyup",e=>{

  if(e.code==="ArrowLeft")keys.left=false;

  if(e.code==="ArrowRight")keys.right=false;

  if(e.code==="ArrowUp" || e.code==="Space"){

    keys.jump=false;

  }

  if(e.code==="KeyJ")keys.attack=false;

  if(e.code==="ShiftLeft")keys.dash=false;

});

/* =========================

   GAME

========================= */

let running=false;

let cameraX=0;

let score=0;

let particles=[];

let effects=[];

let enemies=[];

let walls=[];

let shake=0;

let flash=0;

let slashCooldown=0;

let shurikenCooldown=0;

let ultimateCooldown=0;

/* =========================

   PLAYER

========================= */

const player={

  x:150,

  y:300,

  w:54,

  h:82,

  vx:0,

  vy:0,

  speed:4.2,

  hp:100,

  ground:false,

  wall:false,

  wallSide:0,

  jumps:0,

  direction:1,

  attackTimer:0,

  dashTimer:0,

  invincible:0,

  walkTime:0,

  flip:false,

  flipAngle:0,

  wasGround:false

};

/* =========================

   WORLD

========================= */

const groundY=H-95;

let ground={

  x:-5000,

  y:groundY,

  w:30000,

  h:300

};

function createWorld(){

  enemies=[];

  walls=[];

  /*

    바닥은 완전히 일자

  */

  ground.y=H-95;

  /*

    벽

  */

  for(let i=0;i<30;i++){

    const x=700+i*700;

    walls.push({

      x:x,

      y:ground.y-240,

      w:35,

      h:240

    });

  }

  /*

    적

  */

  for(let i=0;i<35;i++){

    enemies.push({

      x:900+i*520,

      y:ground.y-70,

      w:55,

      h:70,

      hp:100,

      maxHp:100,

      speed:0.65,

      attack:0,

      hit:0

    });

  }

}

/* =========================

   JUMP

========================= */

let jumpPressed=false;

function jump(){

  if(!running)return;

  /*

    벽 점프

  */

  if(player.wall){

    player.vy=-8.2;

    player.vx=-player.wallSide*5.2;

    player.wall=false;

    player.wallSide=0;

    player.jumps=1;

    startFlip();

    return;

  }

  /*

    지상 점프

  */

  if(player.ground){

    player.vy=-9.2;

    player.ground=false;

    player.jumps=1;

    startFlip();

    return;

  }

  /*

    더블 점프

  */

  if(player.jumps<2){

    player.vy=-8.4;

    player.jumps++;

    startFlip();

  }

}

function startFlip(){

  player.flip=true;

  player.flipAngle=0;

}

/* =========================

   PLAYER UPDATE

========================= */

function updatePlayer(){

  let move=0;

  if(keys.left)move--;

  if(keys.right)move++;

  /*

    부드러운 이동

  */

  if(move!==0){

    player.vx+=move*0.45;

    player.direction=move;

    player.walkTime+=0.22;

  }

  else{

    player.vx*=0.78;

  }

  player.vx=Math.max(

    -player.speed,

    Math.min(player.speed,player.vx)

  );

  /*

    벽 감지

  */

  detectWall();

  /*

    벽타기

  */

  if(player.wall && !player.ground){

    if(player.vy>1.7){

      player.vy=1.7;

    }

    if(keys.jump && !jumpPressed){

      jump();

    }

  }

  /*

    중력

  */

  if(player.wall){

    player.vy+=0.16;

  }

  else{

    player.vy+=0.48;

  }

  /*

    대시

  */

  if(

    keys.dash &&

    player.dashTimer<=0

  ){

    player.vx=player.direction*12;

    player.dashTimer=35;

    player.invincible=30;

    for(let i=0;i<12;i++){

      particle(

        player.x,

        player.y+40,

        "dash"

      );

    }

  }

  if(player.dashTimer>0)

    player.dashTimer--;

  if(player.invincible>0)

    player.invincible--;

  /*

    공격

  */

  if(

    keys.attack &&

    player.attackTimer<=0

  ){

    player.attackTimer=24;

    doAttack();

  }

  if(player.attackTimer>0)

    player.attackTimer--;

  /*

    위치 이동

  */

  const oldX=player.x;

  player.x+=player.vx;

  /*

    벽 충돌

  */

  resolveWallCollision(oldX);

  player.y+=player.vy;

  /*

    바닥 충돌

  */

  player.ground=false;

  if(

    player.y+player.h>=ground.y &&

    player.y+player.h<=ground.y+60 &&

    player.vy>=0

  ){

    player.y=ground.y-player.h;

    player.vy=0;

    player.ground=true;

    player.jumps=0;

    /*

      착지 순간 플립 종료

    */

    if(player.flip){

      player.flipAngle=Math.PI*2;

      player.flip=false;

    }

  }

  /*

    플립 애니메이션

  */

  if(player.flip){

    player.flipAngle+=0.16;

    if(player.flipAngle>=Math.PI*2){

      player.flipAngle=Math.PI*2;

    }

  }

  /*

    벽에 붙어있는 동안

    플립은 천천히 진행

  */

  if(player.wall && !player.ground){

    player.flipAngle+=0.08;

    if(player.flipAngle>Math.PI*2)

      player.flipAngle-=Math.PI*2;

  }

  /*

    점프 버튼 상태

  */

  jumpPressed=keys.jump;

  /*

    카메라

  */

  cameraX=player.x-W*0.35;

  /*

    낙사

  */

  if(player.y>H+300){

    player.hp-=20;

    player.x=Math.max(

      100,

      player.x-300

    );

    player.y=ground.y-player.h;

    player.vy=0;

  }

}

/* =========================

   WALL DETECTION

========================= */

function detectWall(){

  player.wall=false;

  player.wallSide=0;

  for(const wall of walls){

    const vertical=

      player.y+player.h>wall.y &&

      player.y<wall.y+wall.h;

    if(!vertical)continue;

    /*

      오른쪽 벽

    */

    if(

      player.x+player.w>=wall.x &&

      player.x+player.w<=wall.x+18 &&

      player.vx>=0

    ){

      player.wall=true;

      player.wallSide=1;

      return;

    }

    /*

      왼쪽 벽

    */

    if(

      player.x<=wall.x+wall.w &&

      player.x>=wall.x+wall.w-18 &&

      player.vx<=0

    ){

      player.wall=true;

      player.wallSide=-1;

      return;

    }

  }

}

/* =========================

   WALL COLLISION

========================= */

function resolveWallCollision(oldX){

  for(const wall of walls){

    const vertical=

      player.y+player.h>wall.y &&

      player.y<wall.y+wall.h;

    if(!vertical)continue;

    /*

      오른쪽으로 이동하며 충돌

    */

    if(

      oldX+player.w<=wall.x &&

      player.x+player.w>wall.x

    ){

      player.x=wall.x-player.w;

      player.vx=0;

    }

    /*

      왼쪽으로 이동하며 충돌

    */

    if(

      oldX>=wall.x+wall.w &&

      player.x<wall.x+wall.w

    ){

      player.x=wall.x+wall.w;

      player.vx=0;

    }

    /*

      혹시 이미 겹쳤다면 강제로 분리

    */

    if(

      player.x<wall.x+wall.w &&

      player.x+player.w>wall.x

    ){

      const pushLeft=

        player.x+player.w-wall.x;

      const pushRight=

        wall.x+wall.w-player.x;

      if(pushLeft<pushRight){

        player.x=wall.x-player.w;

      }

      else{

        player.x=wall.x+wall.w;

      }

      player.vx=0;

    }

  }

}

/* =========================

   ATTACK

========================= */

function doAttack(){

  for(const enemy of enemies){

    const dx=enemy.x-player.x;

    if(

      Math.abs(dx)<110 &&

      Math.abs(enemy.y-player.y)<90 &&

      Math.sign(dx)===player.direction

    ){

      enemy.hp-=35;

      enemy.hit=10;

      enemy.x+=player.direction*18;

      for(let i=0;i<10;i++){

        particle(

          enemy.x,

          enemy.y+30,

          "hit"

        );

      }

    }

  }

  effects.push({

    x:player.x+player.direction*55,

    y:player.y+35,

    life:18,

    type:"attack",

    direction:player.direction

  });

}

/* =========================

   SKILLS

========================= */

function slash(){

  if(slashCooldown>0)return;

  slashCooldown=45;

  player.attackTimer=24;

  doAttack();

}

function shuriken(){

  if(shurikenCooldown>0)return;

  shurikenCooldown=80;

  effects.push({

    x:player.x+player.direction*45,

    y:player.y+30,

    vx:player.direction*10,

    life:100,

    type:"shuriken"

  });

}

function ultimate(){

  if(ultimateCooldown>0)return;

  ultimateCooldown=300;

  player.invincible=100;

  shake=20;

  flash=15;

  for(let i=0;i<60;i++){

    effects.push({

      x:player.x+(Math.random()-0.5)*350,

      y:player.y+(Math.random()-0.5)*200,

      vx:(Math.random()-0.5)*8,

      vy:(Math.random()-0.5)*8,

      life:50,

      type:"ult"

    });

  }

  for(const enemy of enemies){

    if(Math.abs(enemy.x-player.x)<330){

      enemy.hp-=150;

    }

  }

}

document.getElementById("skill1")

.addEventListener("pointerdown",slash);

document.getElementById("skill2")

.addEventListener("pointerdown",shuriken);

document.getElementById("skill3")

.addEventListener("pointerdown",ultimate);

/* =========================

   ENEMIES

========================= */

function updateEnemies(){

  for(const enemy of [...enemies]){

    const dx=player.x-enemy.x;

    const distance=Math.abs(dx);

    if(distance<500){

      enemy.x+=

        Math.sign(dx)*enemy.speed;

    }

    if(enemy.attack>0)

      enemy.attack--;

    if(enemy.hit>0)

      enemy.hit--;

    if(

      distance<75 &&

      Math.abs(player.y-enemy.y)<80 &&

      enemy.attack<=0

    ){

      if(player.invincible<=0){

        player.hp-=10;

        player.invincible=45;

        flash=7;

      }

      enemy.attack=70;

    }

    if(enemy.hp<=0){

      score+=150;

      for(let i=0;i<18;i++){

        particle(

          enemy.x,

          enemy.y+30,

          "hit"

        );

      }

      enemies.splice(

        enemies.indexOf(enemy),

        1

      );

    }

  }

}

/* =========================

   PARTICLES

========================= */

function particle(x,y,type){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-0.5)*7,

    vy:(Math.random()-0.5)*7,

    life:30,

    type:type

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=0.12;

    p.life--;

  }

  particles=

    particles.filter(p=>p.life>0);

}

/* =========================

   EFFECTS

========================= */

function updateEffects(){

  for(const e of effects){

    if(e.vx)e.x+=e.vx;

    if(e.vy)e.y+=e.vy;

    e.life--;

    if(e.type==="shuriken"){

      for(const enemy of enemies){

        if(

          Math.abs(e.x-enemy.x)<45 &&

          Math.abs(e.y-enemy.y)<60

        ){

          enemy.hp-=45;

          e.life=0;

        }

      }

    }

  }

  effects=

    effects.filter(e=>e.life>0);

}

/* =========================

   DRAW BACKGROUND

========================= */

function drawBackground(){

  const gradient=

    ctx.createLinearGradient(

      0,0,0,H

    );

  gradient.addColorStop(

    0,

    "#050817"

  );

  gradient.addColorStop(

    1,

    "#180c28"

  );

  ctx.fillStyle=gradient;

  ctx.fillRect(

    0,0,W,H

  );

  /*

    달

  */

  ctx.fillStyle="#dfffff";

  ctx.shadowBlur=30;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*0.78,

    85,

    35,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*

    도시

  */

  for(let i=0;i<35;i++){

    let x=

      ((i*150-cameraX*0.15)%

      (W+300))-150;

    let height=

      100+(i*71)%280;

    ctx.fillStyle=

      i%3===0

      ?"#0a1830"

      :"#080d20";

    ctx.fillRect(

      x,

      H-95-height,

      90,

      height

    );

    ctx.fillStyle="#00eaff33";

    for(

      let wy=H-85-height+20;

      wy<H-105;

      wy+=28

    ){

      ctx.fillRect(

        x+15,

        wy,

        7,

        5

      );

      ctx.fillRect(

        x+42,

        wy,

        7,

        5

      );

    }

  }

}

/* =========================

   DRAW WORLD

========================= */

function drawWorld(){

  /*

    일자 바닥

  */

  ctx.fillStyle="#080e1c";

  ctx.fillRect(

    ground.x-cameraX,

    ground.y,

    ground.w,

    ground.h

  );

  ctx.fillStyle="#00eaff";

  ctx.shadowBlur=15;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    ground.x-cameraX,

    ground.y,

    ground.w,

    4

  );

  ctx.shadowBlur=0;

  /*

    벽

  */

  for(const wall of walls){

    ctx.fillStyle="#090d1c";

    ctx.fillRect(

      wall.x-cameraX,

      wall.y,

      wall.w,

      wall.h

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.strokeRect(

      wall.x-cameraX,

      wall.y,

      wall.w,

      wall.h

    );

  }

}

/* =========================

   DRAW ENEMIES

========================= */

function drawEnemies(){

  for(const e of enemies){

    const x=e.x-cameraX;

    const y=e.y;

    ctx.save();

    ctx.translate(x,y);

    /*

      그림자

    */

    ctx.fillStyle="#00000066";

    ctx.beginPath();

    ctx.ellipse(

      27,

      70,

      32,

      8,

      0,

      0,

      Math.PI*2

    );

    ctx.fill();

    /*

      몸

    */

    ctx.fillStyle=

      e.hit>0

      ?"#ffffff"

      :"#111827";

    ctx.fillRect(

      9,

      25,

      38,

      42

    );

    /*

      머리

    */

    ctx.beginPath();

    ctx.arc(

      28,

      20,

      22,

      0,

      Math.PI*2

    );

    ctx.fill();

    /*

      눈

    */

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      12,

      17,

      11,

      5

    );

    ctx.fillRect(

      33,

      17,

      11,

      5

    );

    ctx.shadowBlur=0;

    /*

      검

    */

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(

      43,

      38

    );

    ctx.lineTo(

      70,

      8

    );

    ctx.stroke();

    /*

      체력바

    */

    ctx.fillStyle="#250814";

    ctx.fillRect(

      0,

      -14,

      56,

      5

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      0,

      -14,

      56*(e.hp/e.maxHp),

      5

    );

    ctx.restore();

  }

}

/* =========================

   DRAW PLAYER

========================= */

function drawPlayer(){

  ctx.save();

  const cx=

    player.x-cameraX+player.w/2;

  const cy=

    player.y+player.h/2;

  ctx.translate(cx,cy);

  /*

    프런트 플립

    3D 느낌을 주기 위해

    회전 + 크기 변화

  */

  let angle=0;

  let scaleY=1;

  if(player.flip){

    angle=player.flipAngle;

    /*

      앞뒤로 넘어가는 느낌

    */

    scaleY=

      Math.cos(angle)*0.35+0.65;

  }

  if(player.direction<0){

    ctx.scale(-1,1);

  }

  ctx.rotate(angle);

  /*

    착지 / 걷기 흔들림

  */

  let bob=0;

  if(player.ground){

    if(Math.abs(player.vx)>0.4){

      bob=

        Math.sin(player.walkTime)*2.5;

    }

  }

  ctx.translate(

    0,

    bob

  );

  /*

    캐릭터 그림자

  */

  ctx.save();

  ctx.globalAlpha=.3;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(

    0,

    player.h/2+8,

    30,

    7,

    0,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.restore();

  /*

    네 캐릭터 이미지

  */

  if(imageLoaded){

    ctx.drawImage(

      characterImage,

      -player.w/2,

      -player.h/2,

      player.w,

      player.h

    );

  }

  else{

    /*

      사진이 아직 없을 때

      임시 캐릭터

    */

    ctx.fillStyle="#07101d";

    ctx.fillRect(

      -24,

      -38,

      48,

      70

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.strokeRect(

      -24,

      -38,

      48,

      70

    );

    ctx.fillStyle="#8fffff";

    ctx.beginPath();

    ctx.arc(

      0,

      -48,

      20,

      0,

      Math.PI*2

    );

    ctx.fill();

  }

  /*

    공격 애니메이션

  */

  if(player.attackTimer>0){

    const progress=

      1-player.attackTimer/24;

    ctx.save();

    ctx.rotate(

      -1.1+progress*2.1

    );

    ctx.strokeStyle="#ffffff";

    ctx.shadowBlur=25;

    ctx.shadowColor="#00eaff";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(

      22,

      5,

      50,

      -.8,

      .8

    );

    ctx.stroke();

    ctx.restore();

  }

  /*

    벽타기 효과

  */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(

      -30,

      -10

    );

    ctx.lineTo(

      -45,

      -18

    );

    ctx.moveTo(

      -30,

      10

    );

    ctx.lineTo(

      -45,

      3

    );

    ctx.stroke();

  }

  ctx.restore();

}

/* =========================

   DRAW EFFECTS

========================= */

function drawEffects(){

  for(const e of effects){

    ctx.save();

    ctx.translate(

      e.x-cameraX,

      e.y

    );

    if(e.type==="attack"){

      ctx.strokeStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        50,

        -.9,

        .9

      );

      ctx.stroke();

    }

    if(e.type==="shuriken"){

      ctx.strokeStyle="white";

      ctx.lineWidth=4;

      ctx.shadowBlur=15;

      ctx.shadowColor="#00eaff";

      ctx.rotate(

        Date.now()*0.02

      );

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(22,0);

        ctx.stroke();

      }

    }

    if(e.type==="ult"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        5+e.life*.2,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

/* =========================

   PARTICLES DRAW

========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=

      p.life/30;

    ctx.fillStyle=

      p.type==="hit"

      ?"#ff3972"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      5,

      5

    );

  }

  ctx.globalAlpha=1;

}

/* =========================

   UPDATE

========================= */

function update(){

  if(!running)return;

  updatePlayer();

  updateEnemies();

  updateEffects();

  updateParticles();

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById(

    "score"

  ).textContent=score;

  document.getElementById(

    "hp"

  ).style.width=

    Math.max(

      0,

      player.hp

    )+"%";

  document.getElementById(

    "skill1"

  ).textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById(

    "skill2"

  ).textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById(

    "skill3"

  ).textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(slashCooldown>0)

    slashCooldown--;

  if(shurikenCooldown>0)

    shurikenCooldown--;

  if(ultimateCooldown>0)

    ultimateCooldown--;

  if(shake>0)

    shake*=0.88;

  if(flash>0)

    flash--;

  if(player.hp<=0){

    running=false;

    setTimeout(()=>{

      alert(

        "MISSION FAILED!\nSCORE: "+score

      );

      location.reload();

    },100);

  }

}

/* =========================

   DRAW

========================= */

function draw(){

  ctx.save();

  if(shake>0){

    ctx.translate(

      (Math.random()-0.5)*shake,

      (Math.random()-0.5)*shake

    );

  }

  drawBackground();

  drawWorld();

  drawEnemies();

  drawEffects();

  drawPlayer();

  drawParticles();

  ctx.restore();

  if(flash>0){

    ctx.fillStyle=

      "rgba(255,0,70,.12)";

    ctx.fillRect(

      0,

      0,

      W,

      H

    );

  }

}

/* =========================

   START

========================= */

document.getElementById("start")

.addEventListener("click",()=>{

  running=true;

  createWorld();

  player.x=150;

  player.y=ground.y-player.h;

  player.vx=0;

  player.vy=0;

  player.hp=100;

  document.getElementById(

    "menu"

  ).style.display="none";

  document.getElementById(

    "hud"

  ).style.display="flex";

  document.getElementById(

    "controls"

  ).style.display="block";

  document.getElementById(

    "skills"

  ).style.display="flex";

});

createWorld();

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

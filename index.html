<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#02040a;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:radial-gradient(circle,#142743,#02040a 70%);

}

.box{

  width:88%;

  max-width:480px;

  padding:30px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:24px;

  background:#030817ee;

  box-shadow:0 0 40px #00eaff55;

}

h1{

  color:white;

  font-size:46px;

  line-height:.95;

  letter-spacing:4px;

  text-shadow:0 0 20px #00eaff;

}

.sub{

  color:#00eaff;

  margin:15px 0 25px;

  letter-spacing:5px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:14px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

}

#hud{

  display:none;

  position:fixed;

  z-index:10;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  pointer-events:none;

  color:white;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:140px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#ff3972;

}

#controls{

  display:none;

  position:fixed;

  z-index:11;

  inset:0;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:68px;

  height:68px;

  border-radius:50%;

  border:2px solid #ffffff33;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:bold;

  pointer-events:auto;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:95px;

  bottom:18px;

}

#jump{

  right:100px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:15px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:58px;

  bottom:96px;

  width:54px;

  height:54px;

  font-size:11px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:12;

  right:15px;

  bottom:170px;

  gap:7px;

}

.skill{

  width:58px;

  height:43px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:10px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

/* =========================

INPUT

========================= */

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

function bindButton(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{

    e.preventDefault();

    keys[key]=true;

  });

  b.addEventListener("pointerup",e=>{

    e.preventDefault();

    keys[key]=false;

  });

  b.addEventListener("pointercancel",()=>{

    keys[key]=false;

  });

  b.addEventListener("pointerleave",()=>{

    keys[key]=false;

  });

}

bindButton("left","left");

bindButton("right","right");

bindButton("jump","jump");

bindButton("attack","attack");

bindButton("dash","dash");

addEventListener("keydown",e=>{

  if(e.code==="ArrowLeft")keys.left=true;

  if(e.code==="ArrowRight")keys.right=true;

  if(e.code==="ArrowUp"||e.code==="Space")

    keys.jump=true;

  if(e.code==="KeyJ")

    keys.attack=true;

  if(e.code==="ShiftLeft")

    keys.dash=true;

  if(e.code==="Digit1")

    useSlash();

  if(e.code==="Digit2")

    useShuriken();

  if(e.code==="Digit3")

    useUltimate();

});

addEventListener("keyup",e=>{

  if(e.code==="ArrowLeft")keys.left=false;

  if(e.code==="ArrowRight")keys.right=false;

  if(e.code==="ArrowUp"||e.code==="Space")

    keys.jump=false;

  if(e.code==="KeyJ")

    keys.attack=false;

  if(e.code==="ShiftLeft")

    keys.dash=false;

});

/* =========================

GAME

========================= */

let running=false;

let cameraX=0;

let score=0;

let enemies=[];

let particles=[];

let effects=[];

let buildings=[];

let walls=[];

let shake=0;

let flash=0;

const groundY=()=>H-85;

const player={

  x:150,

  y:200,

  w:46,

  h:70,

  vx:0,

  vy:0,

  speed:8,

  hp:100,

  ground:false,

  wall:false,

  wallSide:0,

  direction:1,

  attack:0,

  dash:0,

  invincible:0,

  anim:0,

  jumps:0,

  maxJumps:2,

  jumpLock:false,

  flip:0,

  flipSpeed:0,

  landing:0,

  runPhase:0

};

let slashCooldown=0;

let shurikenCooldown=0;

let ultimateCooldown=0;

/* =========================

WORLD

========================= */

function createWorld(){

  enemies=[];

  buildings=[];

  walls=[];

  for(let i=0;i<160;i++){

    buildings.push({

      x:i*260,

      w:130+(i%4)*35,

      h:130+(i*73)%300

    });

  }

  for(let i=3;i<120;i++){

    if(i%5===0){

      walls.push({

        x:i*500,

        y:groundY()-230,

        w:32,

        h:230

      });

    }

  }

  for(let i=2;i<150;i+=2){

    enemies.push({

      x:i*420+180,

      y:groundY()-62,

      w:45,

      h:62,

      hp:100,

      maxHp:100,

      speed:1.5,

      attack:0,

      anim:0

    });

  }

}

/* =========================

PARTICLES

========================= */

function particle(x,y,type="normal"){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-.5)*9,

    vy:(Math.random()-.5)*9,

    life:30,

    type:type

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.12;

    p.life--;

  }

  particles=particles.filter(p=>p.life>0);

}

/* =========================

SKILLS

========================= */

function useSlash(){

  if(slashCooldown>0)

    return;

  slashCooldown=45;

  player.attack=20;

  player.vx=player.direction*13;

  for(let i=0;i<18;i++){

    effects.push({

      x:player.x+player.direction*45,

      y:player.y+30,

      vx:player.direction*(3+Math.random()*7),

      vy:(Math.random()-.5)*7,

      life:25,

      type:"slash"

    });

  }

}

function useShuriken(){

  if(shurikenCooldown>0)

    return;

  shurikenCooldown=80;

  effects.push({

    x:player.x+player.direction*40,

    y:player.y+25,

    vx:player.direction*15,

    vy:0,

    life:100,

    type:"shuriken"

  });

}

function useUltimate(){

  if(ultimateCooldown>0)

    return;

  ultimateCooldown=300;

  player.invincible=100;

  shake=20;

  flash=15;

  for(let i=0;i<80;i++){

    effects.push({

      x:player.x+(Math.random()-.5)*450,

      y:player.y+(Math.random()-.5)*250,

      vx:(Math.random()-.5)*14,

      vy:(Math.random()-.5)*14,

      life:60,

      type:"ult"

    });

  }

  for(const e of enemies){

    if(Math.abs(e.x-player.x)<350)

      e.hp-=200;

  }

}

document.getElementById("skill1")

.addEventListener("pointerdown",useSlash);

document.getElementById("skill2")

.addEventListener("pointerdown",useShuriken);

document.getElementById("skill3")

.addEventListener("pointerdown",useUltimate);

/* =========================

WALL

========================= */

function checkWall(){

  player.wall=false;

  player.wallSide=0;

  for(const w of walls){

    const vertical=

      player.y+player.h>w.y &&

      player.y<w.y+w.h;

    if(!vertical)

      continue;

    if(

      player.x+player.w>=w.x &&

      player.x+player.w<=w.x+22

    ){

      player.wall=true;

      player.wallSide=1;

      return;

    }

    if(

      player.x<=w.x+w.w &&

      player.x>=w.x+w.w-22

    ){

      player.wall=true;

      player.wallSide=-1;

      return;

    }

  }

}

/* =========================

PLAYER UPDATE

========================= */

function updatePlayer(){

  let move=0;

  if(keys.left)

    move--;

  if(keys.right)

    move++;

  if(move!==0){

    player.vx+=move*.9;

    player.direction=move;

    player.anim+=.35;

    player.runPhase+=.4;

  }else{

    player.vx*=.78;

    player.runPhase*=.9;

  }

  player.vx=

    Math.max(-9,Math.min(9,player.vx));

  checkWall();

  /* 바닥 */

  if(

    player.y+player.h>=groundY() &&

    player.vy>=0

  ){

    if(!player.ground){

      player.landing=10;

    }

    player.y=groundY()-player.h;

    player.vy=0;

    player.ground=true;

    player.jumps=0;

    player.flip=0;

  }else{

    player.ground=false;

  }

  /* 점프 */

  if(keys.jump&&!player.jumpLock){

    player.jumpLock=true;

    if(player.ground){

      player.vy=-16;

      player.ground=false;

      player.jumps=1;

      player.flip=0;

      player.flipSpeed=.32;

    }

    else if(player.wall){

      player.vy=-15;

      player.vx=-player.wallSide*12;

      player.jumps=1;

      player.flip=0;

      player.flipSpeed=.32;

    }

    else if(player.jumps<player.maxJumps){

      player.vy=-15;

      player.jumps++;

      player.flip=0;

      player.flipSpeed=.36;

    }

  }

  if(!keys.jump)

    player.jumpLock=false;

  /* 벽타기 */

  if(

    player.wall &&

    !player.ground

  ){

    if(player.vy>3)

      player.vy=3;

    if(keys.jump){

      player.vy=-13;

      player.vx=-player.wallSide*10;

      player.flip=0;

      player.flipSpeed=.32;

    }

  }

  /* 프런트 플립 */

  if(!player.ground){

    player.flip+=player.flipSpeed;

    if(player.flip>Math.PI*2)

      player.flip-=Math.PI*2;

  }

  /* 대시 */

  if(

    keys.dash &&

    player.dash<=0

  ){

    player.vx=player.direction*19;

    player.vy*=.25;

    player.dash=15;

    player.invincible=35;

    for(let i=0;i<20;i++){

      particle(

        player.x,

        player.y+35,

        "dash"

      );

    }

  }

  /* 공격 */

  if(

    keys.attack &&

    player.attack<=0

  ){

    player.attack=14;

  }

  if(player.attack>0)

    player.attack--;

  if(player.dash>0)

    player.dash--;

  if(player.invincible>0)

    player.invincible--;

  if(player.landing>0)

    player.landing--;

  if(slashCooldown>0)

    slashCooldown--;

  if(shurikenCooldown>0)

    shurikenCooldown--;

  if(ultimateCooldown>0)

    ultimateCooldown--;

  /* 중력 */

  player.vy+=player.wall?.22:.75;

  player.x+=player.vx;

  player.y+=player.vy;

  /* 바닥 아래 방지 */

  if(player.y>H+200){

    player.hp-=20;

    player.y=groundY()-player.h;

    player.vy=0;

  }

  cameraX=player.x-W*.35;

}

/* =========================

ENEMY UPDATE

========================= */

function updateEnemies(){

  for(const e of [...enemies]){

    const dx=player.x-e.x;

    const d=Math.abs(dx);

    if(d<550){

      e.x+=Math.sign(dx)*e.speed;

      e.anim+=.15;

    }

    e.y=groundY()-e.h;

    if(e.attack>0)

      e.attack--;

    if(

      d<70 &&

      e.attack<=0

    ){

      if(player.invincible<=0){

        player.hp-=10;

        player.invincible=45;

        flash=8;

      }

      e.attack=65;

    }

    if(

      player.attack>0 &&

      d<110

    ){

      e.hp-=30;

    }

    for(const s of effects){

      if(

        s.type==="slash" &&

        Math.abs(s.x-e.x)<70

      ){

        e.hp-=7;

      }

      if(

        s.type==="shuriken" &&

        Math.abs(s.x-e.x)<45

      ){

        e.hp-=50;

        s.life=0;

      }

    }

    if(e.hp<=0){

      score+=200;

      for(let i=0;i<20;i++)

        particle(e.x,e.y);

      enemies.splice(

        enemies.indexOf(e),

        1

      );

    }

  }

}

/* =========================

EFFECT UPDATE

========================= */

function updateEffects(){

  for(const s of effects){

    s.x+=s.vx;

    s.y+=s.vy;

    s.life--;

  }

  effects=effects.filter(s=>s.life>0);

}

/* =========================

BACKGROUND

========================= */

function drawBackground(){

  const g=ctx.createLinearGradient(

    0,0,0,H

  );

  g.addColorStop(0,"#050817");

  g.addColorStop(1,"#160b25");

  ctx.fillStyle=g;

  ctx.fillRect(

    0,

    0,

    W,

    H

  );

  /* 달 */

  ctx.fillStyle="#eaffff";

  ctx.shadowBlur=35;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*.78,

    85,

    38,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  /* 도시 */

  for(const b of buildings){

    const x=b.x-cameraX*.35;

    if(x<-300||x>W+300)

      continue;

    ctx.fillStyle="#080d20";

    ctx.fillRect(

      x,

      groundY()-b.h,

      b.w,

      b.h

    );

    for(

      let yy=groundY()-b.h+25;

      yy<groundY();

      yy+=30

    ){

      for(

        let xx=x+15;

        xx<x+b.w-10;

        xx+=28

      ){

        if(

          (Math.floor(xx)+Math.floor(yy))%4===0

        ){

          ctx.fillStyle="#00eaff55";

          ctx.fillRect(

            xx,

            yy,

            7,

            5

          );

        }

      }

    }

  }

}

/* =========================

FLOOR

========================= */

function drawFloor(){

  const y=groundY();

  ctx.fillStyle="#080d18";

  ctx.fillRect(

    0,

    y,

    W,

    H-y

  );

  ctx.fillStyle="#00eaff";

  ctx.shadowBlur=18;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    0,

    y,

    W,

    4

  );

  ctx.shadowBlur=0;

  for(

    let x=-(cameraX%100);

    x<W;

    x+=100

  ){

    ctx.fillStyle="#12223b";

    ctx.fillRect(

      x,

      y+15,

      55,

      3

    );

  }

}

/* =========================

WALL DRAW

========================= */

function drawWalls(){

  for(const w of walls){

    const x=w.x-cameraX;

    if(x<-100||x>W+100)

      continue;

    ctx.fillStyle="#090d1b";

    ctx.fillRect(

      x,

      w.y,

      w.w,

      w.h

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.shadowBlur=15;

    ctx.shadowColor="#00eaff";

    ctx.strokeRect(

      x,

      w.y,

      w.w,

      w.h

    );

    ctx.shadowBlur=0;

  }

}

/* =========================

ENEMY DRAW

========================= */

function drawEnemies(){

  for(const e of enemies){

    const x=e.x-cameraX;

    const y=e.y;

    if(x<-100||x>W+100)

      continue;

    ctx.save();

    ctx.translate(x,y);

    const walk=Math.sin(e.anim)*5;

    /* 그림자 */

    ctx.fillStyle="#00000088";

    ctx.beginPath();

    ctx.ellipse(

      22,

      61,

      30,

      7,

      0,

      0,

      Math.PI*2

    );

    ctx.fill();

    /* 다리 */

    ctx.strokeStyle="#03050a";

    ctx.lineWidth=10;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(14,42);

    ctx.lineTo(8+walk,61);

    ctx.moveTo(29,42);

    ctx.lineTo(36-walk,61);

    ctx.stroke();

    /* 몸 */

    ctx.fillStyle="#111522";

    ctx.fillRect(

      5,

      17,

      34,

      32

    );

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=2;

    ctx.strokeRect(

      5,

      17,

      34,

      32

    );

    /* 머리 */

    ctx.fillStyle="#05070c";

    ctx.beginPath();

    ctx.arc(

      22,

      12,

      18,

      0,

      Math.PI*2

    );

    ctx.fill();

    /* 눈 */

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=18;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      10,

      9,

      9,

      4

    );

    ctx.fillRect(

      25,

      9,

      9,

      4

    );

    ctx.shadowBlur=0;

    /* 검 */

    ctx.strokeStyle="#eee";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(33,29);

    ctx.lineTo(58,4);

    ctx.stroke();

    /* 체력 */

    ctx.fillStyle="#240814";

    ctx.fillRect(

      0,

      -18,

      45,

      5

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      0,

      -18,

      45*(e.hp/e.maxHp),

      5

    );

    ctx.restore();

  }

}

/* =========================

PLAYER DRAW

========================= */

function drawPlayer(){

  ctx.save();

  ctx.translate(

    player.x-cameraX,

    player.y

  );

  if(player.direction<0)

    ctx.scale(-1,1);

  if(

    player.invincible>0 &&

    Math.floor(player.invincible/4)%2===0

  ){

    ctx.globalAlpha=.35;

  }

  /*

  핵심:

  공중에 있으면

  캐릭터 전체가 앞으로 회전한다.

  */

  if(!player.ground){

    ctx.rotate(player.flip);

  }

  /* 착지 눌림 */

  if(player.ground && player.landing>0){

    const squash=

      1-(player.landing/10)*.15;

    ctx.scale(

      1.08,

      squash

    );

  }

  const run=

    player.ground &&

    Math.abs(player.vx)>.5

    ?Math.sin(player.runPhase)*7

    :0;

  /* 그림자 */

  if(player.ground){

    ctx.fillStyle="#00000088";

    ctx.beginPath();

    ctx.ellipse(

      23,

      69,

      30,

      7,

      0,

      0,

      Math.PI*2

    );

    ctx.fill();

  }

  /* 대시 잔상 */

  if(player.dash>0){

    for(let i=1;i<6;i++){

      ctx.globalAlpha=.12;

      ctx.fillStyle="#00eaff";

      ctx.beginPath();

      ctx.arc(

        -i*16,

        35,

        22,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.globalAlpha=1;

  }

  /* 다리 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=11;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(13,45);

  ctx.lineTo(7+run,67);

  ctx.moveTo(31,45);

  ctx.lineTo(37-run,67);

  ctx.stroke();

  /* 네온 다리 */

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(13,45);

  ctx.lineTo(7+run,67);

  ctx.moveTo(31,45);

  ctx.lineTo(37-run,67);

  ctx.stroke();

  /* 몸 */

  ctx.fillStyle="#03050a";

  ctx.fillRect(

    5,

    18,

    35,

    31

  );

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.strokeRect(

    5,

    18,

    35,

    31

  );

  /* 코어 */

  ctx.fillStyle="#00eaff";

  ctx.shadowBlur=15;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    17,

    25,

    12,

    4

  );

  ctx.shadowBlur=0;

  /* 팔 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=10;

  ctx.beginPath();

  ctx.moveTo(9,24);

  ctx.lineTo(-6,35+run);

  ctx.moveTo(36,24);

  ctx.lineTo(50,35-run);

  ctx.stroke();

  /* 머리 */

  ctx.fillStyle="#020306";

  ctx.beginPath();

  ctx.arc(

    23,

    13,

    18,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.stroke();

  /* 눈 */

  ctx.fillStyle="#8fffff";

  ctx.shadowBlur=18;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    11,

    10,

    9,

    4

  );

  ctx.fillRect(

    25,

    10,

    9,

    4

  );

  ctx.shadowBlur=0;

  /* 스카프 */

  ctx.fillStyle="#00cfff";

  ctx.beginPath();

  ctx.moveTo(8,22);

  ctx.lineTo(-15,27);

  ctx.lineTo(-38,42);

  ctx.lineTo(-9,31);

  ctx.fill();

  /* 검 */

  ctx.strokeStyle="white";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(32,29);

  ctx.lineTo(62,2);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(32,29);

  ctx.lineTo(62,2);

  ctx.stroke();

  /* 공격 */

  if(player.attack>0){

    ctx.strokeStyle="#00eaff";

    ctx.shadowBlur=25;

    ctx.shadowColor="#00eaff";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(

      27,

      30,

      52,

      -.9,

      .8

    );

    ctx.stroke();

    ctx.shadowBlur=0;

  }

  /* 벽타기 */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(-10,15);

    ctx.lineTo(-25,7);

    ctx.moveTo(-10,30);

    ctx.lineTo(-25,23);

    ctx.stroke();

  }

  ctx.restore();

}

/* =========================

EFFECT DRAW

========================= */

function drawEffects(){

  for(const s of effects){

    ctx.save();

    ctx.translate(

      s.x-cameraX,

      s.y

    );

    if(s.type==="slash"){

      ctx.strokeStyle="#00eaff";

      ctx.shadowBlur=20;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        40,

        -.9,

        .9

      );

      ctx.stroke();

    }

    if(s.type==="shuriken"){

      ctx.strokeStyle="white";

      ctx.shadowBlur=15;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=4;

      ctx.rotate(Date.now()*.02);

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(25,0);

        ctx.stroke();

      }

    }

    if(s.type==="ult"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        7+s.life*.35,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

/* =========================

PARTICLES DRAW

========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life/30;

    ctx.fillStyle=

      p.type==="dash"

      ?"white"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      5,

      5

    );

  }

  ctx.globalAlpha=1;

}

/* =========================

UPDATE

========================= */

function update(){

  if(!running)

    return;

  updatePlayer();

  updateEnemies();

  updateEffects();

  updateParticles();

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById("score")

  .textContent=score;

  document.getElementById("hp")

  .style.width=Math.max(0,player.hp)+"%";

  document.getElementById("skill1")

  .textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById("skill2")

  .textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById("skill3")

  .textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(shake>0)

    shake*=.88;

  if(flash>0)

    flash--;

  if(player.hp<=0){

    running=false;

    setTimeout(()=>{

      alert(

        "MISSION FAILED!\nSCORE: "+score

      );

      location.reload();

    },50);

  }

}

/* =========================

DRAW

========================= */

function draw(){

  ctx.save();

  if(shake>0){

    ctx.translate(

      (Math.random()-.5)*shake,

      (Math.random()-.5)*shake

    );

  }

  drawBackground();

  drawFloor();

  drawWalls();

  drawEnemies();

  drawEffects();

  drawPlayer();

  drawParticles();

  ctx.restore();

  if(flash>0){

    ctx.fillStyle="rgba(255,0,70,.12)";

    ctx.fillRect(

      0,

      0,

      W,

      H

    );

  }

}

/* =========================

START

========================= */

document.getElementById("start")

.addEventListener("pointerdown",e=>{

  e.preventDefault();

  running=true;

  createWorld();

  document.getElementById("menu")

  .style.display="none";

  document.getElementById("hud")

  .style.display="flex";

  document.getElementById("controls")

  .style.display="block";

  document.getElementById("skills")

  .style.display="flex";

});

/* =========================

LOOP

========================= */

createWorld();

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

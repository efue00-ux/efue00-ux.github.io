<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#02040a;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:radial-gradient(circle,#162c48,#02040a 75%);

}

.box{

  width:88%;

  max-width:460px;

  padding:32px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:24px;

  background:#030817ee;

  box-shadow:0 0 40px #00eaff55;

}

h1{

  color:white;

  font-size:48px;

  line-height:.9;

  letter-spacing:4px;

  text-shadow:0 0 25px #00eaff;

}

.sub{

  color:#00eaff;

  margin:18px 0 28px;

  letter-spacing:5px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:14px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

}

#hud{

  display:none;

  position:fixed;

  z-index:5;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  color:white;

  pointer-events:none;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:140px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#00eaff;

}

#controls{

  display:none;

  position:fixed;

  inset:0;

  z-index:15;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:70px;

  height:70px;

  border-radius:50%;

  border:2px solid #ffffff33;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  font-weight:bold;

  pointer-events:auto;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:98px;

  bottom:18px;

}

#jump{

  right:100px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:15px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:58px;

  bottom:98px;

  width:55px;

  height:55px;

  font-size:10px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:16;

  right:15px;

  bottom:170px;

  gap:7px;

}

.skill{

  width:60px;

  height:43px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:9px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

let jumpPressed=false;

function bind(id,key){

  const button=document.getElementById(id);

  button.addEventListener("pointerdown",function(e){

    e.preventDefault();

    keys[key]=true;

    if(key==="jump"){

      jumpPressed=true;

    }

  });

  button.addEventListener("pointerup",function(e){

    e.preventDefault();

    keys[key]=false;

  });

  button.addEventListener("pointercancel",function(){

    keys[key]=false;

  });

}

bind("left","left");

bind("right","right");

bind("jump","jump");

bind("attack","attack");

bind("dash","dash");

addEventListener("keydown",function(e){

  if(e.code==="ArrowLeft"){

    keys.left=true;

  }

  if(e.code==="ArrowRight"){

    keys.right=true;

  }

  if(e.code==="ArrowUp" || e.code==="Space"){

    if(!keys.jump){

      jumpPressed=true;

    }

    keys.jump=true;

  }

  if(e.code==="KeyJ"){

    keys.attack=true;

  }

  if(e.code==="ShiftLeft"){

    keys.dash=true;

  }

  if(e.code==="Digit1"){

    useSlash();

  }

  if(e.code==="Digit2"){

    useShuriken();

  }

  if(e.code==="Digit3"){

    useUltimate();

  }

});

addEventListener("keyup",function(e){

  if(e.code==="ArrowLeft"){

    keys.left=false;

  }

  if(e.code==="ArrowRight"){

    keys.right=false;

  }

  if(e.code==="ArrowUp" || e.code==="Space"){

    keys.jump=false;

  }

  if(e.code==="KeyJ"){

    keys.attack=false;

  }

  if(e.code==="ShiftLeft"){

    keys.dash=false;

  }

});

let running=false;

let cameraX=0;

let score=0;

let enemies=[];

let particles=[];

let effects=[];

let slashCooldown=0;

let shurikenCooldown=0;

let ultimateCooldown=0;

const player={

  x:250,

  y:100,

  w:82,

  h:120,

  vx:0,

  vy:0,

  maxSpeed:4.5,

  acceleration:.42,

  friction:.78,

  jumpPower:10,

  hp:100,

  ground:false,

  wall:false,

  wallSide:0,

  jumps:0,

  maxJumps:2,

  direction:1,

  attack:0,

  dash:0,

  invincible:0,

  walkTime:0,

  flip:0,

  wallJumpTimer:0

};

function createEnemies(){

  enemies=[];

  for(let i=0;i<100;i++){

    enemies.push({

      x:900+i*520,

      y:H-332,

      w:72,

      h:82,

      hp:100,

      maxHp:100,

      speed:1

    });

  }

}

function particle(x,y,type){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-.5)*7,

    vy:(Math.random()-.5)*7,

    life:30,

    type:type||"normal"

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.12;

    p.life--;

  }

  particles=particles.filter(p=>p.life>0);

}

function useSlash(){

  if(slashCooldown>0){

    return;

  }

  slashCooldown=45;

  player.attack=22;

  for(let i=0;i<16;i++){

    effects.push({

      x:player.x+player.direction*55,

      y:player.y+55,

      vx:player.direction*(2+Math.random()*6),

      vy:(Math.random()-.5)*6,

      life:25,

      type:"slash"

    });

  }

}

function useShuriken(){

  if(shurikenCooldown>0){

    return;

  }

  shurikenCooldown=90;

  effects.push({

    x:player.x+player.direction*55,

    y:player.y+45,

    vx:player.direction*10,

    vy:0,

    life:100,

    type:"shuriken"

  });

}

function useUltimate(){

  if(ultimateCooldown>0){

    return;

  }

  ultimateCooldown=300;

  player.invincible=90;

  for(let i=0;i<70;i++){

    effects.push({

      x:player.x+(Math.random()-.5)*500,

      y:player.y+(Math.random()-.5)*300,

      vx:(Math.random()-.5)*8,

      vy:(Math.random()-.5)*8,

      life:60,

      type:"ult"

    });

  }

  for(const e of enemies){

    if(Math.abs(e.x-player.x)<350){

      e.hp-=150;

    }

  }

}

document.getElementById("skill1")

.addEventListener("pointerdown",useSlash);

document.getElementById("skill2")

.addEventListener("pointerdown",useShuriken);

document.getElementById("skill3")

.addEventListener("pointerdown",useUltimate);

function checkWall(){

  player.wall=false;

  player.wallSide=0;

  const wallSpacing=520;

  for(let i=1;i<1000;i++){

    const wx=i*wallSpacing+300;

    if(

      player.x+player.w>wx &&

      player.x<wx+32 &&

      player.y+player.h>H-500 &&

      player.y<H-250

    ){

      player.wall=true;

      player.wallSide=1;

      return;

    }

  }

}

function updatePlayer(){

  let move=0;

  if(keys.left){

    move--;

  }

  if(keys.right){

    move++;

  }

  if(move!==0){

    player.vx+=move*player.acceleration;

    player.direction=move;

    player.walkTime+=Math.abs(player.vx)*.16;

  }

  else{

    player.vx*=player.friction;

  }

  player.vx=Math.max(

    -player.maxSpeed,

    Math.min(player.maxSpeed,player.vx)

  );

  checkWall();

  if(jumpPressed){

    if(player.wall){

      player.vy=-8;

      player.vx=-player.direction*6;

      player.wallJumpTimer=15;

      player.jumps=1;

      player.wall=false;

    }

    else if(player.ground){

      player.vy=-player.jumpPower;

      player.ground=false;

      player.jumps=1;

      player.flip=0;

    }

    else if(player.jumps<player.maxJumps){

      player.vy=-9;

      player.jumps++;

      player.flip=0;

    }

  }

  jumpPressed=false;

  if(player.wall && !player.ground){

    if(player.vy>1){

      player.vy=.65;

    }

    if(keys.jump){

      player.vy=-7;

    }

  }

  if(keys.dash && player.dash<=0){

    player.vx=player.direction*9;

    player.vy=0;

    player.dash=16;

    player.invincible=25;

    for(let i=0;i<12;i++){

      particle(player.x,player.y+60,"dash");

    }

  }

  if(keys.attack && player.attack<=0){

    useSlash();

  }

  if(player.attack>0){

    player.attack--;

  }

  if(player.dash>0){

    player.dash--;

  }

  if(player.invincible>0){

    player.invincible--;

  }

  if(player.wallJumpTimer>0){

    player.wallJumpTimer--;

  }

  if(slashCooldown>0){

    slashCooldown--;

  }

  if(shurikenCooldown>0){

    shurikenCooldown--;

  }

  if(ultimateCooldown>0){

    ultimateCooldown--;

  }

  if(!player.wall){

    player.vy+=.55;

  }

  player.x+=player.vx;

  player.y+=player.vy;

  const floor=H-250;

  if(player.y+player.h>=floor){

    player.y=floor-player.h;

    player.vy=0;

    if(!player.ground){

      player.jumps=0;

    }

    player.ground=true;

    player.flip=0;

  }

  else{

    player.ground=false;

  }

  if(player.y>H+200){

    player.y=100;

    player.vy=0;

    player.hp-=10;

  }

  cameraX=player.x-W*.3;

  if(cameraX<0){

    cameraX=0;

  }

}

function updateEnemies(){

  for(const e of enemies){

    if(e.hp<=0){

      continue;

    }

    const dx=player.x-e.x;

    const d=Math.abs(dx);

    if(d<600){

      e.x+=Math.sign(dx)*e.speed;

    }

    if(

      d<90 &&

      Math.abs(player.y-e.y)<100

    ){

      if(player.invincible<=0){

        player.hp-=8;

        player.invincible=40;

      }

    }

    if(

      player.attack>0 &&

      d<130 &&

      Math.abs(player.y-e.y)<100

    ){

      e.hp-=30;

    }

    for(const s of effects){

      if(

        s.type==="shuriken" &&

        Math.abs(s.x-e.x)<60 &&

        Math.abs(s.y-e.y)<80

      ){

        e.hp-=50;

        s.life=0;

      }

    }

    if(e.hp<=0){

      score+=150;

      for(let i=0;i<20;i++){

        particle(e.x,e.y,"enemy");

      }

    }

  }

}

function updateEffects(){

  for(const s of effects){

    s.x+=s.vx;

    s.y+=s.vy;

    s.life--;

  }

  effects=effects.filter(s=>s.life>0);

}

function drawBackground(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#050817");

  g.addColorStop(1,"#170b25");

  ctx.fillStyle=g;

  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#dfffff";

  ctx.shadowBlur=25;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*.78,

    85,

    38,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  for(let i=0;i<40;i++){

    const x=

      ((i*170-cameraX*.18)%(W+400))-200;

    const h=100+(i*73)%300;

    ctx.fillStyle=

      i%3===0

      ?"#0b1830"

      :"#080d20";

    ctx.fillRect(

      x,

      H-250-h,

      110,

      h

    );

  }

}

function drawGround(){

  const floor=H-250;

  ctx.fillStyle="#080d18";

  ctx.fillRect(

    0,

    floor,

    W,

    250

  );

  ctx.fillStyle="#061a2b";

  ctx.fillRect(

    0,

    floor,

    W,

    12

  );

  ctx.fillStyle="#00eaff";

  ctx.shadowBlur=15;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    0,

    floor,

    W,

    4

  );

  ctx.shadowBlur=0;

  for(

    let x=-cameraX%80;

    x<W;

    x+=80

  ){

    ctx.strokeStyle="#10283c";

    ctx.beginPath();

    ctx.moveTo(x,floor+15);

    ctx.lineTo(x,floor+250);

    ctx.stroke();

  }

}

function drawWalls(){

  for(let i=1;i<1000;i++){

    const wx=i*520+300-cameraX;

    if(wx<-50 || wx>W+50){

      continue;

    }

    ctx.fillStyle="#090d1c";

    ctx.fillRect(

      wx,

      H-500,

      32,

      250

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.strokeRect(

      wx,

      H-500,

      32,

      250

    );

  }

}

function drawPlayer(){

  const x=player.x-cameraX+player.w/2;

  const y=player.y+player.h/2;

  ctx.save();

  ctx.translate(x,y);

  if(player.direction<0){

    ctx.scale(-1,1);

  }

  if(

    player.invincible>0 &&

    Math.floor(player.invincible/4)%2===0

  ){

    ctx.globalAlpha=.45;

  }

  if(!player.ground){

    player.flip+=.12;

    ctx.rotate(player.flip);

  }

  const step=

    player.ground &&

    Math.abs(player.vx)>.3

    ?Math.sin(player.walkTime)*14

    :0;

  if(player.dash>0){

    for(let i=1;i<5;i++){

      ctx.globalAlpha=.12;

      ctx.fillStyle="#00eaff";

      ctx.beginPath();

      ctx.arc(

        -i*18,

        0,

        32,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.globalAlpha=1;

  }

  /* 다리 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=16;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-18,25);

  ctx.lineTo(-30+step,70);

  ctx.moveTo(18,25);

  ctx.lineTo(30-step,70);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-18,25);

  ctx.lineTo(-30+step,70);

  ctx.moveTo(18,25);

  ctx.lineTo(30-step,70);

  ctx.stroke();

  /* 몸 */

  ctx.fillStyle="#020306";

  ctx.beginPath();

  ctx.roundRect(

    -32,

    -35,

    64,

    70,

    18

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.stroke();

  /* 팔 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=15;

  ctx.beginPath();

  ctx.moveTo(-27,-20);

  ctx.lineTo(-60,10+step*.5);

  ctx.moveTo(27,-20);

  ctx.lineTo(60,10-step*.5);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-27,-20);

  ctx.lineTo(-60,10+step*.5);

  ctx.moveTo(27,-20);

  ctx.lineTo(60,10-step*.5);

  ctx.stroke();

  /* 머리 */

  ctx.fillStyle="#020306";

  ctx.beginPath();

  ctx.arc(

    0,

    -57,

    36,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.stroke();

  /* 눈 */

  ctx.fillStyle="#aaffff";

  ctx.shadowBlur=20;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    -22,

    -63,

    16,

    7

  );

  ctx.fillRect(

    6,

    -63,

    16,

    7

  );

  ctx.shadowBlur=0;

  /* 스카프 */

  ctx.fillStyle="#00d9ff";

  ctx.beginPath();

  ctx.moveTo(-27,-30);

  ctx.lineTo(-65,-15);

  ctx.lineTo(-95,12);

  ctx.lineTo(-48,-3);

  ctx.fill();

  /* 검 */

  ctx.strokeStyle="white";

  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(35,-5);

  ctx.lineTo(95,-60);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(35,-5);

  ctx.lineTo(95,-60);

  ctx.stroke();

  /* 공격 */

  if(player.attack>0){

    ctx.strokeStyle="#00eaff";

    ctx.shadowBlur=30;

    ctx.shadowColor="#00eaff";

    ctx.lineWidth=9;

    ctx.beginPath();

    ctx.arc(

      40,

      0,

      80,

      -.9,

      .9

    );

    ctx.stroke();

    ctx.shadowBlur=0;

  }

  /* 벽타기 */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-45,-35);

    ctx.lineTo(-75,-50);

    ctx.moveTo(-45,0);

    ctx.lineTo(-75,-10);

    ctx.stroke();

  }

  ctx.restore();

}

function drawEnemies(){

  for(const e of enemies){

    if(e.hp<=0){

      continue;

    }

    const x=e.x-cameraX;

    const y=e.y;

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle="#05070c";

    ctx.fillRect(

      5,

      15,

      60,

      70

    );

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=4;

    ctx.strokeRect(

      5,

      15,

      60,

      70

    );

    ctx.fillStyle="#05070c";

    ctx.beginPath();

    ctx.arc(

      35,

      5,

      31,

      0,

      Math.PI*2

    );

    ctx.fill();

    ctx.stroke();

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=18;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      15,

      0,

      14,

      7

    );

    ctx.fillRect(

      42,

      0,

      14,

      7

    );

    ctx.shadowBlur=0;

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(55,40);

    ctx.lineTo(90,5);

    ctx.stroke();

    ctx.fillStyle="#260814";

    ctx.fillRect(

      5,

      -30,

      60,

      7

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      5,

      -30,

      60*(e.hp/e.maxHp),

      7

    );

    ctx.restore();

  }

}

function drawEffects(){

  for(const s of effects){

    ctx.save();

    ctx.translate(

      s.x-cameraX,

      s.y

    );

    if(s.type==="slash"){

      ctx.strokeStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        50,

        -.9,

        .9

      );

      ctx.stroke();

    }

    if(s.type==="shuriken"){

      ctx.strokeStyle="white";

      ctx.shadowBlur=18;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=4;

      ctx.rotate(Date.now()*.02);

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(30,0);

        ctx.stroke();

      }

    }

    if(s.type==="ult"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        8+s.life*.3,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life/30;

    ctx.fillStyle=

      p.type==="enemy"

      ?"#ff3972"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      6,

      6

    );

  }

  ctx.globalAlpha=1;

}

function update(){

  if(!running){

    return;

  }

  updatePlayer();

  updateEnemies();

  updateEffects();

  updateParticles();

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById("score")

  .textContent=score;

  document.getElementById("hp")

  .style.width=

    Math.max(0,player.hp)+"%";

  document.getElementById("skill1")

  .textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById("skill2")

  .textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById("skill3")

  .textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(player.hp<=0){

    running=false;

    setTimeout(function(){

      alert("MISSION FAILED");

      location.reload();

    },100);

  }

}

function draw(){

  drawBackground();

  drawGround();

  drawWalls();

  drawEnemies();

  drawEffects();

  drawPlayer();

  drawParticles();

}

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);

}

document.getElementById("start")

.addEventListener("click",function(){

  running=true;

  createEnemies();

  document.getElementById("menu")

  .style.display="none";

  document.getElementById("hud")

  .style.display="flex";

  document.getElementById("controls")

  .style.display="block";

  document.getElementById("skills")

  .style.display="flex";

});

loop();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

user-select:none;

-webkit-user-select:none;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#02040a;

touch-action:none;

font-family:Arial,sans-serif;

}

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

}

#menu{

position:fixed;

inset:0;

z-index:20;

display:flex;

align-items:center;

justify-content:center;

background:radial-gradient(circle,#142743,#02040a 70%);

}

.box{

width:88%;

max-width:480px;

padding:30px;

text-align:center;

border:2px solid #00eaff;

border-radius:24px;

background:#030817ee;

box-shadow:0 0 40px #00eaff55;

}

h1{

color:white;

font-size:46px;

letter-spacing:4px;

line-height:.95;

text-shadow:0 0 20px #00eaff;

}

.sub{

color:#00eaff;

margin:15px 0 25px;

letter-spacing:5px;

}

#start{

width:100%;

padding:18px;

border:0;

border-radius:14px;

background:linear-gradient(90deg,#00d9ff,#765cff);

color:white;

font-size:20px;

font-weight:bold;

}

#hud{

display:none;

position:fixed;

z-index:10;

top:12px;

left:12px;

right:12px;

justify-content:space-between;

color:white;

pointer-events:none;

}

.hud{

background:#050b18dd;

border:1px solid #00eaff77;

border-radius:12px;

padding:9px 12px;

}

#hpbar{

width:140px;

height:9px;

margin-top:5px;

background:#222;

border-radius:8px;

overflow:hidden;

}

#hp{

width:100%;

height:100%;

background:#ff3972;

}

#controls{

display:none;

position:fixed;

inset:0;

z-index:11;

pointer-events:none;

}

.btn{

position:absolute;

width:68px;

height:68px;

border-radius:50%;

border:2px solid #ffffff33;

background:#061027dd;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

font-weight:bold;

pointer-events:auto;

}

#left{

left:15px;

bottom:18px;

}

#right{

left:95px;

bottom:18px;

}

#jump{

right:100px;

bottom:18px;

color:#00eaff;

}

#attack{

right:15px;

bottom:18px;

color:#ff3972;

}

#dash{

right:58px;

bottom:96px;

width:54px;

height:54px;

font-size:11px;

color:#a878ff;

}

#skills{

display:none;

position:fixed;

z-index:12;

right:15px;

bottom:170px;

gap:7px;

}

.skill{

width:58px;

height:43px;

border:2px solid #00eaff;

border-radius:11px;

background:#061027ee;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:10px;

font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="box">

<h1>SHADOW<br>NINJA</h1>

<div class="sub">NEON RISE</div>

<button id="start">START MISSION</button>

</div>

</div>

<div id="hud">

<div class="hud">

HP

<div id="hpbar">

<div id="hp"></div>

</div>

</div>

<div class="hud">

SCORE <span id="score">0</span>

</div>

</div>

<div id="controls">

<div class="btn" id="left">◀</div>

<div class="btn" id="right">▶</div>

<div class="btn" id="jump">↑</div>

<div class="btn" id="attack">⚔</div>

<div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

<div class="skill" id="skill1">SLASH</div>

<div class="skill" id="skill2">SHURIKEN</div>

<div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

W=innerWidth;

H=innerHeight;

canvas.width=W;

canvas.height=H;

}

addEventListener("resize",resize);

resize();

const keys={

left:false,

right:false,

jump:false,

attack:false,

dash:false

};

function button(id,key){

const b=document.getElementById(id);

b.addEventListener("pointerdown",e=>{

e.preventDefault();

keys[key]=true;

});

b.addEventListener("pointerup",e=>{

e.preventDefault();

keys[key]=false;

});

b.addEventListener("pointercancel",()=>{

keys[key]=false;

});

b.addEventListener("pointerleave",()=>{

keys[key]=false;

});

}

button("left","left");

button("right","right");

button("jump","jump");

button("attack","attack");

button("dash","dash");

addEventListener("keydown",e=>{

if(e.code==="ArrowLeft")keys.left=true;

if(e.code==="ArrowRight")keys.right=true;

if(e.code==="ArrowUp"||e.code==="Space")

keys.jump=true;

if(e.code==="KeyJ")

keys.attack=true;

if(e.code==="ShiftLeft")

keys.dash=true;

});

addEventListener("keyup",e=>{

if(e.code==="ArrowLeft")keys.left=false;

if(e.code==="ArrowRight")keys.right=false;

if(e.code==="ArrowUp"||e.code==="Space")

keys.jump=false;

if(e.code==="KeyJ")

keys.attack=false;

if(e.code==="ShiftLeft")

keys.dash=false;

});

let running=false;

let cameraX=0;

let score=0;

let enemies=[];

let particles=[];

let projectiles=[];

let buildings=[];

let walls=[];

const player={

x:180,

y:100,

w:46,

h:70,

vx:0,

vy:0,

hp:100,

direction:1,

ground:false,

wall:false,

wallSide:0,

jumps:0,

maxJumps:2,

jumpPressed:false,

flip:0,

flipSpeed:0,

attack:0,

dash:0,

invincible:0,

walk:0,

land:0

};

let groundY=0;

function updateGround(){

groundY=H-85;

}

updateGround();

function createWorld(){

enemies=[];

walls=[];

buildings=[];

for(let i=0;i<200;i++){

buildings.push({

x:i*240,

w:100+(i%4)*35,

h:120+(i*71)%300

});

}

for(let i=4;i<100;i+=4){

walls.push({

x:i*500,

y:groundY-250,

w:35,

h:250

});

}

for(let i=3;i<150;i+=2){

enemies.push({

x:i*420+250,

y:groundY-62,

w:46,

h:62,

hp:100,

maxHp:100,

speed:1.3,

walk:0,

attack:0

});

}

}

function particle(x,y,type){

particles.push({

x:x,

y:y,

vx:(Math.random()-.5)*8,

vy:(Math.random()-.5)*8,

life:30,

type:type||"normal"

});

}

function updateParticles(){

for(const p of particles){

p.x+=p.vx;

p.y+=p.vy;

p.vy+=.12;

p.life--;

}

particles=particles.filter(p=>p.life>0);

}

function checkWall(){

player.wall=false;

player.wallSide=0;

for(const w of walls){

if(

player.y+player.h>w.y &&

player.y<w.y+w.h

){

if(

player.x+player.w>w.x &&

player.x+player.w<w.x+25

){

player.wall=true;

player.wallSide=1;

return;

}

if(

player.x<w.x+w.w &&

player.x>w.x+w.w-25

){

player.wall=true;

player.wallSide=-1;

return;

}

}

}

}

function jump(){

if(player.ground){

player.vy=-16;

player.ground=false;

player.jumps=1;

player.flip=0;

player.flipSpeed=.32;

return;

}

if(player.wall){

player.vy=-15;

player.vx=-player.wallSide*12;

player.jumps=1;

player.flip=0;

player.flipSpeed=.34;

return;

}

if(player.jumps<player.maxJumps){

player.vy=-15;

player.jumps++;

player.flip=0;

player.flipSpeed=.36;

}

}

function updatePlayer(){

let move=0;

if(keys.left)move--;

if(keys.right)move++;

if(move!==0){

player.vx+=move*.9;

player.direction=move;

player.walk+=.38;

}else{

player.vx*=.78;

}

player.vx=Math.max(-9,Math.min(9,player.vx));

checkWall();

if(

keys.jump &&

!player.jumpPressed

){

jump();

}

player.jumpPressed=keys.jump;

if(

player.wall &&

!player.ground

){

if(player.vy>3)

player.vy=3;

}

if(

keys.dash &&

player.dash<=0

){

player.vx=player.direction*19;

player.vy*=.2;

player.dash=15;

player.invincible=35;

for(let i=0;i<20;i++)

particle(player.x,player.y+35,"dash");

}

if(

keys.attack &&

player.attack<=0

){

player.attack=16;

}

if(player.attack>0)

player.attack--;

if(player.dash>0)

player.dash--;

if(player.invincible>0)

player.invincible--;

if(!player.ground){

player.flip+=player.flipSpeed;

if(player.flip>Math.PI*2)

player.flip-=Math.PI*2;

}

player.vy+=player.wall?.2:.75;

player.x+=player.vx;

player.y+=player.vy;

player.ground=false;

if(

player.y+player.h>=groundY &&

player.vy>=0

){

if(!player.ground)

player.land=8;

player.y=groundY-player.h;

player.vy=0;

player.ground=true;

player.jumps=0;

player.flip=0;

}

if(player.land>0)

player.land--;

for(const w of walls){

if(

player.x+player.w>w.x &&

player.x<w.x+w.w &&

player.y+player.h>w.y &&

player.y<w.y+w.h

){

if(player.vx>0)

player.x=w.x-player.w;

if(player.vx<0)

player.x=w.x+w.w;

}

}

cameraX=player.x-W*.35;

}

function updateEnemies(){

for(const e of enemies){

const dx=player.x-e.x;

if(Math.abs(dx)<600){

e.x+=Math.sign(dx)*e.speed;

e.walk+=.18;

}

e.y=groundY-e.h;

if(e.attack>0)

e.attack--;

if(

Math.abs(dx)<70 &&

e.attack<=0

){

if(player.invincible<=0){

player.hp-=10;

player.invincible=45;

}

e.attack=60;

}

if(

player.attack>0 &&

Math.abs(dx)<110 &&

Math.abs(player.y-e.y)<80

){

e.hp-=35;

}

if(e.hp<=0){

for(let i=0;i<20;i++)

particle(e.x,e.y);

score+=200;

e.x=-999999;

}

}

enemies=enemies.filter(e=>e.x>-100000);

}

function updateProjectiles(){

for(const p of projectiles){

p.x+=p.vx;

p.life--;

for(const e of enemies){

if(

Math.abs(p.x-e.x)<45 &&

Math.abs(p.y-e.y)<60

){

e.hp-=50;

p.life=0;

}

}

}

projectiles=projectiles.filter(p=>p.life>0);

}

function update(){

if(!running)return;

updateGround();

updatePlayer();

updateEnemies();

updateParticles();

updateProjectiles();

score=Math.max(

score,

Math.floor(player.x/10)

);

document.getElementById("score").textContent=score;

document.getElementById("hp").style.width=

Math.max(0,player.hp)+"%";

if(player.hp<=0){

running=false;

setTimeout(()=>{

alert("MISSION FAILED!");

location.reload();

},100);

}

}

function drawBackground(){

const g=ctx.createLinearGradient(

0,0,0,H

);

g.addColorStop(0,"#050817");

g.addColorStop(1,"#160b25");

ctx.fillStyle=g;

ctx.fillRect(0,0,W,H);

ctx.fillStyle="#eaffff";

ctx.shadowBlur=35;

ctx.shadowColor="#00eaff";

ctx.beginPath();

ctx.arc(

W*.78,

80,

38,

0,

Math.PI*2

);

ctx.fill();

ctx.shadowBlur=0;

for(const b of buildings){

const x=b.x-cameraX*.3;

if(x<-300||x>W+300)

continue;

ctx.fillStyle="#080d20";

ctx.fillRect(

x,

groundY-b.h,

b.w,

b.h

);

for(

let yy=groundY-b.h+25;

yy<groundY;

yy+=30

){

for(

let xx=x+15;

xx<x+b.w-10;

xx+=28

){

ctx.fillStyle="#00eaff55";

ctx.fillRect(

xx,

yy,

7,

5

);

}

}

}

}

function drawFloor(){

ctx.fillStyle="#080d18";

ctx.fillRect(

0,

groundY,

W,

H-groundY

);

ctx.fillStyle="#00eaff";

ctx.shadowBlur=15;

ctx.shadowColor="#00eaff";

ctx.fillRect(

0,

groundY,

W,

4

);

ctx.shadowBlur=0;

for(

let x=-(cameraX%100);

x<W;

x+=100

){

ctx.fillStyle="#14263f";

ctx.fillRect(

x,

groundY+18,

55,

3

);

}

}

function drawWalls(){

for(const w of walls){

const x=w.x-cameraX;

if(x<-100||x>W+100)

continue;

ctx.fillStyle="#090d1c";

ctx.fillRect(

x,

w.y,

w.w,

w.h

);

ctx.strokeStyle="#00eaff";

ctx.lineWidth=3;

ctx.shadowBlur=15;

ctx.shadowColor="#00eaff";

ctx.strokeRect(

x,

w.y,

w.w,

w.h

);

ctx.shadowBlur=0;

}

}

function drawEnemies(){

for(const e of enemies){

const x=e.x-cameraX;

const y=e.y;

ctx.save();

ctx.translate(x,y);

const leg=Math.sin(e.walk)*6;

ctx.strokeStyle="#03050a";

ctx.lineWidth=11;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(14,43);

ctx.lineTo(7+leg,61);

ctx.moveTo(31,43);

ctx.lineTo(38-leg,61);

ctx.stroke();

ctx.fillStyle="#101522";

ctx.fillRect(

5,

17,

35,

32

);

ctx.strokeStyle="#ff3972";

ctx.lineWidth=2;

ctx.strokeRect(

5,

17,

35,

32

);

ctx.fillStyle="#03050a";

ctx.beginPath();

ctx.arc(

23,

12,

18,

0,

Math.PI*2

);

ctx.fill();

ctx.fillStyle="#ff3972";

ctx.shadowBlur=15;

ctx.shadowColor="#ff3972";

ctx.fillRect(11,9,9,4);

ctx.fillRect(26,9,9,4);

ctx.shadowBlur=0;

ctx.strokeStyle="white";

ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(33,29);

ctx.lineTo(60,3);

ctx.stroke();

ctx.fillStyle="#240814";

ctx.fillRect(

0,

-18,

46,

5

);

ctx.fillStyle="#ff3972";

ctx.fillRect(

0,

-18,

46*(e.hp/e.maxHp),

5

);

ctx.restore();

}

}

function drawPlayer(){

ctx.save();

ctx.translate(

player.x-cameraX,

player.y

);

if(player.direction<0)

ctx.scale(-1,1);

if(!player.ground){

ctx.rotate(player.flip);

}

if(

player.invincible>0 &&

Math.floor(player.invincible/4)%2===0

){

ctx.globalAlpha=.35;

}

const run=

player.ground &&

Math.abs(player.vx)>.5

?Math.sin(player.walk)*7

:0;

if(player.ground){

ctx.fillStyle="#00000077";

ctx.beginPath();

ctx.ellipse(

23,

70,

30,

7,

0,

0,

Math.PI*2

);

ctx.fill();

}

if(player.dash>0){

for(let i=1;i<6;i++){

ctx.globalAlpha=.12;

ctx.fillStyle="#00eaff";

ctx.beginPath();

ctx.arc(

-i*16,

35,

22,

0,

Math.PI*2

);

ctx.fill();

}

ctx.globalAlpha=1;

}

ctx.strokeStyle="#020306";

ctx.lineWidth=11;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(13,45);

ctx.lineTo(7+run,67);

ctx.moveTo(31,45);

ctx.lineTo(37-run,67);

ctx.stroke();

ctx.strokeStyle="#00eaff";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(13,45);

ctx.lineTo(7+run,67);

ctx.moveTo(31,45);

ctx.lineTo(37-run,67);

ctx.stroke();

ctx.fillStyle="#03050a";

ctx.fillRect(

5,

18,

36,

31

);

ctx.strokeStyle="#00eaff";

ctx.lineWidth=2;

ctx.strokeRect(

5,

18,

36,

31

);

ctx.fillStyle="#00eaff";

ctx.shadowBlur=15;

ctx.shadowColor="#00eaff";

ctx.fillRect(

17,

25,

13,

5

);

ctx.shadowBlur=0;

ctx.strokeStyle="#020306";

ctx.lineWidth=10;

ctx.beginPath();

ctx.moveTo(9,24);

ctx.lineTo(-7,35+run);

ctx.moveTo(37,24);

ctx.lineTo(51,35-run);

ctx.stroke();

ctx.fillStyle="#020306";

ctx.beginPath();

ctx.arc(

23,

13,

18,

0,

Math.PI*2

);

ctx.fill();

ctx.strokeStyle="#00eaff";

ctx.lineWidth=2;

ctx.stroke();

ctx.fillStyle="#8fffff";

ctx.shadowBlur=18;

ctx.shadowColor="#00eaff";

ctx.fillRect(11,10,9,4);

ctx.fillRect(26,10,9,4);

ctx.shadowBlur=0;

ctx.fillStyle="#00cfff";

ctx.beginPath();

ctx.moveTo(8,22);

ctx.lineTo(-15,28);

ctx.lineTo(-40,43);

ctx.lineTo(-9,32);

ctx.fill();

ctx.strokeStyle="white";

ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(32,29);

ctx.lineTo(63,2);

ctx.stroke();

ctx.strokeStyle="#00eaff";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(32,29);

ctx.lineTo(63,2);

ctx.stroke();

if(player.attack>0){

ctx.strokeStyle="#00eaff";

ctx.shadowBlur=25;

ctx.shadowColor="#00eaff";

ctx.lineWidth=7;

ctx.beginPath();

ctx.arc(

27,

30,

52,

-.9,

.8

);

ctx.stroke();

ctx.shadowBlur=0;

}

if(player.wall){

ctx.strokeStyle="#00eaff";

ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(-10,15);

ctx.lineTo(-25,7);

ctx.moveTo(-10,30);

ctx.lineTo(-25,23);

ctx.stroke();

}

ctx.restore();

}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=p.life/30;

ctx.fillStyle=

p.type==="dash"

?"white"

:"#00eaff";

ctx.fillRect(

p.x-cameraX,

p.y,

5,

5

);

}

ctx.globalAlpha=1;

}

function draw(){

drawBackground();

drawFloor();

drawWalls();

drawEnemies();

drawPlayer();

drawParticles();

}

document.getElementById("start")

.addEventListener("pointerdown",e=>{

e.preventDefault();

running=true;

createWorld();

document.getElementById("menu").style.display="none";

document.getElementById("hud").style.display="flex";

document.getElementById("controls").style.display="block";

document.getElementById("skills").style.display="flex";

});

createWorld();

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>

</html>

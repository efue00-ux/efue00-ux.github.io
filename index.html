<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{box-sizing:border-box;margin:0;padding:0;user-select:none}

html,body{width:100%;height:100%;overflow:hidden;background:#02040a;touch-action:none;font-family:Arial}

canvas{position:fixed;inset:0;width:100%;height:100%}

#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#123653,#02040a 70%)}

.box{width:88%;max-width:480px;padding:30px;text-align:center;border:2px solid #00eaff;border-radius:24px;background:#030817ee;box-shadow:0 0 40px #00eaff55}

h1{color:white;font-size:52px;line-height:.9;letter-spacing:5px;text-shadow:0 0 25px #00eaff}

.sub{color:#00eaff;margin:18px 0 25px;letter-spacing:6px}

#start{width:100%;padding:18px;border:0;border-radius:14px;background:linear-gradient(90deg,#00d9ff,#765cff);color:white;font-size:20px;font-weight:bold}

#hud{display:none;position:fixed;z-index:5;top:10px;left:10px;right:10px;justify-content:space-between;color:white}

.panel{background:#030817dd;border:1px solid #00eaff66;border-radius:12px;padding:8px 12px}

#hpbar{width:130px;height:8px;margin-top:5px;background:#24101a;border-radius:8px;overflow:hidden}

#hp{width:100%;height:100%;background:#ff3972}

#controls{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}

.btn{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid #ffffff33;background:#061027dd;color:white;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;pointer-events:auto}

#left{left:15px;bottom:18px}

#right{left:94px;bottom:18px}

#jump{right:100px;bottom:18px;color:#00eaff}

#attack{right:15px;bottom:18px;color:#ff3972}

#dash{right:58px;bottom:96px;width:54px;height:54px;font-size:10px;color:#a878ff}

#skills{display:none;position:fixed;z-index:9;right:15px;bottom:170px;gap:7px}

.skill{width:60px;height:43px;border:2px solid #00eaff;border-radius:11px;background:#061027ee;color:white;font-size:9px;font-weight:bold}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="box">

<h1>SHADOW<br>NINJA</h1>

<div class="sub">NEON RISE</div>

<button id="start">START MISSION</button>

</div>

</div>

<div id="hud">

<div class="panel">HP<div id="hpbar"><div id="hp"></div></div></div>

<div class="panel">SCORE <b id="score">0</b></div>

<div class="panel">JUMP <b id="jumps">2</b></div>

</div>

<div id="controls">

<div class="btn" id="left">◀</div>

<div class="btn" id="right">▶</div>

<div class="btn" id="jump">↑</div>

<div class="btn" id="attack">⚔</div>

<div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

<button class="skill" id="skill1">SLASH</button>

<button class="skill" id="skill2">SHURIKEN</button>

<button class="skill" id="skill3">ULT</button>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

let DPR=Math.min(devicePixelRatio||1,2);

function resize(){

W=innerWidth;

H=innerHeight;

DPR=Math.min(devicePixelRatio||1,2);

canvas.width=W*DPR;

canvas.height=H*DPR;

canvas.style.width=W+"px";

canvas.style.height=H+"px";

ctx.setTransform(DPR,0,0,DPR,0,0);

}

addEventListener("resize",resize);

resize();

const input={

left:false,

right:false,

jump:false,

attack:false,

dash:false

};

function bind(id,key){

const b=document.getElementById(id);

b.addEventListener("pointerdown",e=>{

e.preventDefault();

input[key]=true;

});

b.addEventListener("pointerup",e=>{

e.preventDefault();

input[key]=false;

});

b.addEventListener("pointercancel",()=>{

input[key]=false;

});

b.addEventListener("pointerleave",()=>{

input[key]=false;

});

}

bind("left","left");

bind("right","right");

bind("jump","jump");

bind("attack","attack");

bind("dash","dash");

addEventListener("keydown",e=>{

if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=true;

if(e.code==="ArrowRight"||e.code==="KeyD")input.right=true;

if(e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")input.jump=true;

if(e.code==="KeyJ")input.attack=true;

if(e.code==="ShiftLeft")input.dash=true;

if(e.code==="Digit1")slash();

if(e.code==="Digit2")shuriken();

if(e.code==="Digit3")ultimate();

});

addEventListener("keyup",e=>{

if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=false;

if(e.code==="ArrowRight"||e.code==="KeyD")input.right=false;

if(e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")input.jump=false;

if(e.code==="KeyJ")input.attack=false;

if(e.code==="ShiftLeft")input.dash=false;

});

let running=false;

let camera=0;

let score=0;

let shake=0;

let flash=0;

let platforms=[];

let walls=[];

let enemies=[];

let shots=[];

let effects=[];

let particles=[];

let gems=[];

let previousJump=false;

let previousDash=false;

let previousAttack=false;

const player={

x:120,

y:200,

w:38,

h:58,

vx:0,

vy:0,

dir:1,

ground:false,

wall:false,

wallSide:0,

jumps:2,

dash:0,

attack:0,

inv:0,

anim:0,

hp:100

};

let slashCD=0;

let shurikenCD=0;

let ultCD=0;

function baseY(){

return H-105;

}

function addPlatform(x,y,w,h){

platforms.push({x:x,y:y,w:w,h:h});

}

function createWorld(){

platforms=[];

walls=[];

enemies=[];

shots=[];

effects=[];

particles=[];

gems=[];

const y=baseY();

addPlatform(-200,y,16000,70);

let x=500;

for(let i=0;i<55;i++){

x+=270+(i%4)*25;

let py=y-(i%6)*22;

addPlatform(x,py,260+(i%3)*45,38);

if(i%3===1){

walls.push({

x:x+190,

y:py-240,

w:30,

h:240

});

}

if(i%5===2){

walls.push({

x:x-30,

y:py-180,

w:30,

h:180

});

}

if(i%2===0){

enemies.push({

x:x+130,

y:py-58,

w:42,

h:58,

hp:70,

maxHp:70,

attack:0,

hit:0,

anim:0

});

}

if(i%3===0){

gems.push({

x:x+70,

y:py-75,

t:Math.random()*6,

got:false

});

}

}

}

function particle(x,y,type){

particles.push({

x:x,

y:y,

vx:(Math.random()-.5)*8,

vy:(Math.random()-.5)*8,

life:30+Math.random()*20,

type:type||"cyan"

});

}

function burst(x,y,n,type){

for(let i=0;i<n;i++){

particle(x,y,type);

}

}

function slash(){

if(slashCD>0)return;

slashCD=45;

player.attack=18;

player.vx=player.dir*12;

shake=5;

effects.push({

x:player.x+player.dir*35,

y:player.y+25,

life:18,

type:"slash",

dir:player.dir

});

burst(player.x+player.dir*40,player.y+25,12,"cyan");

}

function shuriken(){

if(shurikenCD>0)return;

shurikenCD=85;

effects.push({

x:player.x+player.dir*35,

y:player.y+22,

vx:player.dir*13,

life:100,

type:"shuriken"

});

}

function ultimate(){

if(ultCD>0)return;

ultCD=300;

player.inv=90;

shake=18;

flash=12;

burst(player.x,player.y,70,"ult");

for(const e of enemies){

if(Math.abs(e.x-player.x)<360){

e.hp-=130;

}

}

}

skill1.onclick=slash;

skill2.onclick=shuriken;

skill3.onclick=ultimate;

function touchingWall(){

player.wall=false;

player.wallSide=0;

for(const w of walls){

if(

player.x+player.w>w.x&&

player.x<w.x+w.w&&

player.y+player.h>w.y&&

player.y<w.y+w.h

){

player.wall=true;

if(player.x+player.w/2<w.x+w.w/2)

player.wallSide=1;

else

player.wallSide=-1;

return;

}

}

}

function updatePlayer(){

let move=0;

if(input.left)move--;

if(input.right)move++;

if(move){

player.vx+=move*.85;

player.dir=move;

player.anim+=.25+Math.abs(player.vx)*.03;

}else{

player.vx*=.8;

}

player.vx=Math.max(-8.5,Math.min(8.5,player.vx));

touchingWall();

let jumpPressed=input.jump&&!previousJump;

if(jumpPressed){

if(player.wall&&!player.ground){

player.vy=-13;

player.vx=-player.wallSide*9;

player.jumps=1;

burst(

player.x+player.wallSide*10,

player.y+30,

12,

"cyan"

);

}else if(player.ground){

player.vy=-15;

player.ground=false;

player.jumps=1;

}else if(player.jumps>0){

player.vy=-14;

player.jumps--;

burst(player.x,player.y+30,12,"ult");

}

}

previousJump=input.jump;

if(player.wall&&!player.ground){

if(player.vy>3)

player.vy=3;

}

let dashPressed=input.dash&&!previousDash;

if(dashPressed&&player.dash<=0){

player.vx=player.dir*18;

player.vy*=.25;

player.dash=14;

player.inv=35;

burst(player.x,player.y+30,18,"dash");

}

previousDash=input.dash;

let attackPressed=input.attack&&!previousAttack;

if(attackPressed)

slash();

previousAttack=input.attack;

if(player.attack>0)player.attack--;

if(player.dash>0)player.dash--;

if(player.inv>0)player.inv--;

if(slashCD>0)slashCD--;

if(shurikenCD>0)shurikenCD--;

if(ultCD>0)ultCD--;

player.vy+=player.wall&&!player.ground?.18:.72;

player.x+=player.vx;

player.y+=player.vy;

player.ground=false;

for(const q of platforms){

if(

player.x+player.w>q.x&&

player.x<q.x+q.w&&

player.y+player.h>=q.y&&

player.y+player.h<=q.y+28&&

player.vy>=0

){

player.y=q.y-player.h;

player.vy=0;

player.ground=true;

player.jumps=2;

}

}

for(const w of walls){

if(

player.x+player.w>w.x&&

player.x<w.x+w.w&&

player.y+player.h>w.y&&

player.y<w.y+w.h

){

if(player.vx>0)

player.x=w.x-player.w;

if(player.vx<0)

player.x=w.x+w.w;

}

}

if(player.y>H+200){

player.hp-=15;

player.x=Math.max(80,player.x-300);

player.y=baseY()-player.h-100;

player.vy=0;

}

camera+=(player.x-W*.35-camera)*.12;

}

function updateEnemies(){

for(const e of enemies){

e.anim+=.18;

if(e.attack>0)e.attack--;

if(e.hit>0)e.hit--;

let dx=player.x-e.x;

if(Math.abs(dx)<520)

e.x+=Math.sign(dx)*1.15;

if(

Math.abs(dx)<65&&

Math.abs(player.y-e.y)<75&&

e.attack<=0

){

if(player.inv<=0){

player.hp-=10;

player.inv=40;

flash=6;

}

e.attack=60;

}

for(const s of effects){

if(

s.type==="slash"&&

Math.abs(s.x-e.x)<90&&

Math.abs(s.y-e.y)<75

){

e.hp-=28;

e.hit=8;

}

if(

s.type==="shuriken"&&

Math.abs(s.x-e.x)<40&&

Math.abs(s.y-e.y)<60

){

e.hp-=50;

s.life=0;

e.hit=8;

}

}

}

for(let i=enemies.length-1;i>=0;i--){

if(enemies[i].hp<=0){

score+=150;

burst(enemies[i].x,enemies[i].y,20,"red");

enemies.splice(i,1);

}

}

}

function updateEffects(){

for(const s of effects){

if(s.vx)s.x+=s.vx;

s.life--;

}

effects=effects.filter(s=>s.life>0);

for(const p of particles){

p.x+=p.vx;

p.y+=p.vy;

p.vy+=.12;

p.life--;

}

particles=particles.filter(p=>p.life>0);

for(const g of gems){

g.t+=.06;

if(

!g.got&&

Math.abs(g.x-player.x)<35&&

Math.abs(g.y-player.y)<70

){

g.got=true;

score+=100;

burst(g.x,g.y,15,"cyan");

}

}

}

function drawBackground(){

let grad=ctx.createLinearGradient(0,0,0,H);

grad.addColorStop(0,"#03091a");

grad.addColorStop(1,"#15091e");

ctx.fillStyle=grad;

ctx.fillRect(0,0,W,H);

ctx.fillStyle="#e8ffff";

ctx.shadowBlur=30;

ctx.shadowColor="#00eaff";

ctx.beginPath();

ctx.arc(W*.78,80,35,0,Math.PI*2);

ctx.fill();

ctx.shadowBlur=0;

for(let i=0;i<35;i++){

let x=((i*160-camera*.18)%(W+300))-150;

let h=100+(i*71)%260;

ctx.fillStyle=i%3===0?"#0b1931":"#070d20";

ctx.fillRect(

x,

H-65-h,

90,

h

);

}

}

function drawWorld(){

for(const q of platforms){

let x=q.x-camera;

ctx.fillStyle="#091326";

ctx.fillRect(x,q.y,q.w,q.h);

ctx.fillStyle="#17304a";

ctx.fillRect(x,q.y+7,q.w,q.h-7);

ctx.fillStyle="#00eaff";

ctx.shadowBlur=12;

ctx.shadowColor="#00eaff";

ctx.fillRect(x,q.y,q.w,3);

ctx.shadowBlur=0;

}

for(const w of walls){

let x=w.x-camera;

ctx.fillStyle="#080c18";

ctx.fillRect(x,w.y,w.w,w.h);

ctx.strokeStyle="#00eaff";

ctx.lineWidth=3;

ctx.shadowBlur=12;

ctx.shadowColor="#00eaff";

ctx.strokeRect(x,w.y,w.w,w.h);

ctx.shadowBlur=0;

}

for(const g of gems){

if(g.got)continue;

let x=g.x-camera;

let y=g.y+Math.sin(g.t)*7;

ctx.save();

ctx.translate(x,y);

ctx.rotate(Math.PI/4);

ctx.fillStyle="#bfffff";

ctx.shadowBlur=20;

ctx.shadowColor="#00eaff";

ctx.fillRect(-9,-9,18,18);

ctx.restore();

}

}

function drawNinja(x,y,dir,enemy,anim,attack,alpha){

ctx.save();

ctx.translate(x,y);

ctx.scale(dir,1);

ctx.globalAlpha=alpha;

let run=Math.sin(anim)*5;

let glow=enemy?"#ff3972":"#00eaff";

ctx.fillStyle=glow;

ctx.shadowBlur=15;

ctx.shadowColor=glow;

ctx.beginPath();

ctx.moveTo(7,21);

ctx.lineTo(-18,28+run*.4);

ctx.lineTo(-40,38+run);

ctx.lineTo(-8,31);

ctx.fill();

ctx.shadowBlur=0;

ctx.strokeStyle="#020306";

ctx.lineWidth=10;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(12,42);

ctx.lineTo(7+run,58);

ctx.moveTo(27,42);

ctx.lineTo(32-run,58);

ctx.stroke();

ctx.strokeStyle=glow;

ctx.lineWidth=2;

ctx.stroke();

ctx.fillStyle="#020306";

ctx.fillRect(5,18,28,29);

ctx.strokeStyle=glow;

ctx.strokeRect(5,18,28,29);

ctx.strokeStyle="#020306";

ctx.lineWidth=9;

ctx.beginPath();

ctx.moveTo(8,23);

ctx.lineTo(-6,34+run);

ctx.moveTo(30,23);

ctx.lineTo(43,34-run);

ctx.stroke();

ctx.fillStyle="#020306";

ctx.beginPath();

ctx.arc(19,13,17,0,Math.PI*2);

ctx.fill();

ctx.strokeStyle=glow;

ctx.lineWidth=2;

ctx.stroke();

ctx.fillStyle=enemy?"#ff7790":"#bfffff";

ctx.shadowBlur=15;

ctx.shadowColor=glow;

ctx.fillRect(8,10,8,4);

ctx.fillRect(22,10,8,4);

ctx.shadowBlur=0;

ctx.strokeStyle="white";

ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(29,28);

ctx.lineTo(58,2);

ctx.stroke();

ctx.strokeStyle=glow;

ctx.lineWidth=2;

ctx.stroke();

if(attack){

ctx.strokeStyle=glow;

ctx.shadowBlur=25;

ctx.shadowColor=glow;

ctx.lineWidth=7;

ctx.beginPath();

ctx.arc(25,28,50,-.9,.8);

ctx.stroke();

ctx.shadowBlur=0;

}

ctx.restore();

}

function drawEnemies(){

for(const e of enemies){

let alpha=e.hit?0.5:1;

drawNinja(

e.x-camera,

e.y,

player.x<e.x?-1:1,

true,

e.anim,

e.attack>40,

alpha

);

ctx.fillStyle="#250914";

ctx.fillRect(e.x-camera,e.y-13,42,4);

ctx.fillStyle="#ff3972";

ctx.fillRect(

e.x-camera,

e.y-13,

42*Math.max(0,e.hp/e.maxHp),

4

);

}

}

function drawPlayer(){

if(

player.inv>0&&

Math.floor(player.inv/4)%2===0

)return;

if(player.dash>0){

for(let i=4;i>0;i--){

drawNinja(

player.x-camera-i*15,

player.y,

player.dir,

false,

player.anim,

false,

.08

);

}

}

drawNinja(

player.x-camera,

player.y,

player.dir,

false,

player.anim,

player.attack>0,

1

);

if(player.wall&&!player.ground){

ctx.strokeStyle="#00eaff";

ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(player.x-camera-10,player.y+18);

ctx.lineTo(player.x-camera-24,player.y+10);

ctx.moveTo(player.x-camera-10,player.y+33);

ctx.lineTo(player.x-camera-24,player.y+27);

ctx.stroke();

}

}

function drawEffects(){

for(const s of effects){

if(s.type==="slash"){

ctx.save();

ctx.translate(s.x-camera,s.y);

ctx.scale(s.dir,1);

ctx.strokeStyle="#00eaff";

ctx.shadowBlur=25;

ctx.shadowColor="#00eaff";

ctx.lineWidth=7;

ctx.beginPath();

ctx.arc(0,0,50,-.95,.8);

ctx.stroke();

ctx.restore();

}

if(s.type==="shuriken"){

ctx.save();

ctx.translate(s.x-camera,s.y);

ctx.rotate(performance.now()*.02);

ctx.strokeStyle="white";

ctx.shadowBlur=20;

ctx.shadowColor="#765cff";

ctx.lineWidth=4;

for(let i=0;i<4;i++){

ctx.rotate(Math.PI/2);

ctx.beginPath();

ctx.moveTo(0,0);

ctx.lineTo(24,0);

ctx.stroke();

}

ctx.restore();

}

}

for(const p of particles){

ctx.globalAlpha=Math.max(0,p.life/45);

ctx.fillStyle=p.type==="red"?"#ff3972":"#00eaff";

ctx.fillRect(

p.x-camera,

p.y,

5,

5

);

}

ctx.globalAlpha=1;

}

function updateHUD(){

document.getElementById("hp").style.width=

Math.max(0,player.hp)+"%";

document.getElementById("score").textContent=

Math.floor(score);

document.getElementById("jumps").textContent=

player.jumps;

skill1.textContent=slashCD?Math.ceil(slashCD/60):"SLASH";

skill2.textContent=shurikenCD?Math.ceil(shurikenCD/60):"SHURIKEN";

skill3.textContent=ultCD?Math.ceil(ultCD/60):"ULT";

}

function update(){

if(!running)return;

updatePlayer();

updateEnemies();

updateEffects();

score=Math.max(score,Math.floor(player.x/8));

updateHUD();

shake*=.88;

if(flash>0)flash--;

if(player.hp<=0){

running=false;

setTimeout(()=>{

alert("MISSION FAILED!");

location.reload();

},100);

}

}

function draw(){

ctx.save();

if(shake>0){

ctx.translate(

(Math.random()-.5)*shake,

(Math.random()-.5)*shake

);

}

drawBackground();

drawWorld();

drawEnemies();

drawEffects();

drawPlayer();

ctx.restore();

if(flash){

ctx.fillStyle="rgba(255,0,70,.13)";

ctx.fillRect(0,0,W,H);

}

}

document.getElementById("start").addEventListener("pointerdown",e=>{

e.preventDefault();

running=true;

createWorld();

player.x=120;

player.y=baseY()-player.h;

player.vx=0;

player.vy=0;

player.hp=100;

player.jumps=2;

score=0;

document.getElementById("menu").style.display="none";

document.getElementById("hud").style.display="flex";

document.getElementById("controls").style.display="block";

document.getElementById("skills").style.display="flex";

});

createWorld();

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>점프맵 1탄</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}
body {
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}
#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(#87ceeb 0%, #dff6ff 70%);
}
#world {
  position: absolute;
  width: 100%;
  height: 100%;
}
.player {
  position: absolute;
  width: 35px;
  height: 35px;
  background: #ff4757;
  border: 3px solid #fff;
  border-radius: 10px;
  z-index: 10;
}
.platform {
  position: absolute;
  height: 22px;
  background: #2ed573;
  border: 3px solid #1e9e52;
  border-radius: 7px;
}
.goal {
  position: absolute;
  width: 55px;
  height: 70px;
  background: #ffd32a;
  border: 4px solid #f39c12;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  padding-top: 20px;
  z-index: 5;
}
#info {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.55);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  z-index: 50;
  font-size: 15px;
}
.controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
}
.left-controls {
  display: flex;
  gap: 12px;
}
button {
  width: 70px;
  height: 70px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  color: white;
  font-size: 30px;
  font-weight: bold;
  -webkit-tap-highlight-color: transparent;
}
button:active {
  background: rgba(0,0,0,.8);
  transform: scale(.94);
}
#win {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 200;
  color: white;
  text-align: center;
  padding-top: 30vh;
}
#win h1 {
  font-size: 45px;
  margin-bottom: 20px;
}
#restart {
  border-radius: 15px;
  width: 180px;
  height: 60px;
  font-size: 20px;
  background: #2ed573;
}
</style>
</head>
<body>
<div id="game">
  <div id="world">
<div class="player" id="player"></div>

<!-- 발판 -->

<div class="platform" style="left:0%; top:85%; width:35%;"></div>
<div class="platform" style="left:43%; top:73%; width:25%;"></div>
<div class="platform" style="left:72%; top:61%; width:25%;"></div>
<div class="platform" style="left:48%; top:49%; width:20%;"></div>
<div class="platform" style="left:18%; top:37%; width:25%;"></div>
<div class="platform" style="left:55%; top:25%; width:25%;"></div>
<div class="platform" style="left:78%; top:13%; width:22%;"></div>
<!-- 골인 -->
<div class="goal" id="goal" style="left:84%; top:5%;">
  GOAL
</div>  
     <div id="info">🏃 점프해서 GOAL까지 가세요!</div>
   <div class="controls">
    <div class="left-controls">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
  <button id="jump">⬆</button>
   </div>
    <div id="win">
    <h1>🎉 CLEAR!</h1>
    <p>점프맵을 클리어했습니다!</p>
    <br>
    <button id="restart">다시 하기</button>
  </div>
</div>
<script>
const player = document.getElementById("player");
const goal = document.getElementById("goal");
const win = document.getElementById("win");
const world = document.getElementById("world");
let x = 40;
let y = window.innerHeight * 0.75;
let vx = 0;
let vy = 0;
let leftPressed = false;
let rightPressed = false;
let grounded = false;
let gameOver = false;
const speed = 4.5;
const gravity = 0.65;
const jumpPower = -12;
const platforms = [...document.querySelectorAll(".platform")];
function setPosition() {
  player.style.left = x + "px";
  player.style.top = y + "px";
}
function jump() {
  if (grounded && !gameOver) {
    vy = jumpPower;
    grounded = false;
  }
}
function rect(el) {
  return el.getBoundingClientRect();
}
function update() {
  if (gameOver) return;
  if (leftPressed) vx = -speed;
  else if (rightPressed) vx = speed;
  else vx *= 0.8;
  x += vx;
  vy += gravity;
  y += vy;
  grounded = false;
  // 화면 좌우 제한
  if (x < 0) x = 0;
  if (x > window.innerWidth - 35) {
    x = window.innerWidth - 35;
  }
  // 발판 충돌
  const playerLeft = x;
  const playerRight = x + 35;
  const playerBottom = y + 35;
  for (const p of platforms) {
    const r = rect(p);
    const platformLeft = r.left;
    const platformRight = r.right;
    const platformTop = r.top;
    if (
      playerRight > platformLeft &&
      playerLeft < platformRight &&
      playerBottom >= platformTop &&
      playerBottom <= platformTop + 25 &&
      vy >= 0
    ) {
      y = platformTop - 35;
      vy = 0;
      grounded = true;
    }
  }
  // 골인
  const g = rect(goal);
  if (
    playerRight > g.left &&
    playerLeft < g.right &&
    playerBottom > g.top &&
    y < g.bottom
  ) {
    win.style.display = "block";
    gameOver = true;
  }
  // 떨어짐
  if (y > window.innerHeight + 100) {
    reset();
  }
  setPosition();
  requestAnimationFrame(update);
}
function reset() {
  x = 40;
  y = window.innerHeight * 0.75;
  vx = 0;
  vy = 0;
  grounded = false;
  setPosition();
}
function restart() {
  win.style.display = "none";
  gameOver = false;
  reset();
  requestAnimationFrame(update);
}
// 버튼 조작
function holdButton(button, down, up) {
  button.addEventListener("touchstart", e => {
    e.preventDefault();
    down();
  });
  button.addEventListener("touchend", e => {
    e.preventDefault();
    up();
  });
  button.addEventListener("mousedown", e => {
    e.preventDefault();
    down();
  });
  button.addEventListener("mouseup", e => {
    e.preventDefault();
    up();
  });
}
holdButton(
  document.getElementById("left"),
  () => leftPressed = true,
  () => leftPressed = false
);
holdButton(
  document.getElementById("right"),
  () => rightPressed = true,
  () => rightPressed = false
);
document.getElementById("jump").addEventListener("touchstart", e => {
  e.preventDefault();
  jump();
});
document.getElementById("jump").addEventListener("mousedown", e => {
  e.preventDefault();
  jump();
});
document.getElementById("restart").addEventListener("click", restart);
setPosition();
requestAnimationFrame(update);
</script>
</body>
</html>

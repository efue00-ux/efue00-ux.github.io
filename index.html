<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>극한 점프맵</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#87ceeb;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#level{
  position:fixed;
  top:15px;
  left:15px;
  padding:10px 16px;
  background:rgba(0,0,0,.55);
  color:white;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  z-index:5;
}

#message{
  position:fixed;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.55);
  padding:8px 15px;
  border-radius:10px;
  font-weight:bold;
  z-index:5;
}

#buttons{
  position:fixed;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  z-index:10;
}

button{
  width:70px;
  height:70px;
  margin:3px;
  border:none;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:28px;
  user-select:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="level">LEVEL 1</div>
<div id="message">START!</div>

<div id="buttons">
  <div>
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <button id="jump">▲</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

window.addEventListener("resize",()=>{
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
});

const player={
  x:60,
  y:200,
  w:34,
  h:34,
  vx:0,
  vy:0,
  ground:false
};

let platforms=[];
let spikes=[];
let cameraX=0;
let level=1;

let left=false;
let right=false;
let jump=false;

let finishX=0;

const gravity=.7;
const jumpPower=-13;

function createLevel(){

  platforms=[];
  spikes=[];

  let x=0;
  let y=H-80;

  const platformWidth=Math.max(65,145-level*8);
  const minGap=70+level*5;
  const maxGap=105+level*8;
  const maxHeight=Math.min(110,45+level*7);

  platforms.push({
    x:0,
    y:y,
    w:240,
    h:30
  });

  for(let i=0;i<18;i++){

    const gap=minGap+Math.random()*(maxGap-minGap);

    x+=platformWidth+gap;

    y+=(Math.random()*2-1)*maxHeight;

    if(y<150)y=150;
    if(y>H-100)y=H-100;

    platforms.push({
      x:x,
      y:y,
      w:platformWidth,
      h:30
    });

    if(level>=3 && i>1){

      if(Math.random()<0.35+level*.03){

        spikes.push({
          x:x+platformWidth*.5-15,
          y:y-22,
          w:30,
          h:22
        });
      }
    }
  }

  finishX=
    platforms[platforms.length-1].x+
    platforms[platforms.length-1].w;

  player.x=60;
  player.y=H-160;
  player.vx=0;
  player.vy=0;
  cameraX=0;

  document.getElementById("level").textContent=
    "LEVEL "+level;

  document.getElementById("message").textContent=
    level===1 ? "START!" : "LEVEL "+level+"!";

  setTimeout(()=>{
    document.getElementById("message").textContent="";
  },1500);
}

function restartLevel(){

  player.x=60;
  player.y=H-160;
  player.vx=0;
  player.vy=0;
  cameraX=0;

  document.getElementById("message").textContent="다시 도전!";

  setTimeout(()=>{
    document.getElementById("message").textContent="";
  },1000);
}

function update(){

  if(left)player.vx-=.6;
  if(right)player.vx+=.6;

  if(!left&&!right)player.vx*=.82;

  if(player.vx>7)player.vx=7;
  if(player.vx<-7)player.vx=-7;

  if(jump&&player.ground){
    player.vy=jumpPower;
    player.ground=false;
  }

  jump=false;

  player.vy+=gravity;

  const oldY=player.y;

  player.x+=player.vx;
  player.y+=player.vy;

  player.ground=false;

  for(const p of platforms){

    if(
      player.vy>=0 &&
      oldY+player.h<=p.y &&
      player.y+player.h>=p.y &&
      player.x+player.w>p.x &&
      player.x<p.x+p.w
    ){

      player.y=p.y-player.h;
      player.vy=0;
      player.ground=true;
    }
  }

  for(const s of spikes){

    if(
      player.x<s.x+s.w &&
      player.x+player.w>s.x &&
      player.y<s.y+s.h &&
      player.y+player.h>s.y
    ){

      restartLevel();
      return;
    }
  }

  if(player.y>H+200){
    restartLevel();
    return;
  }

  if(player.x>=finishX-20){

    level++;
    createLevel();
    return;
  }

  cameraX=player.x-W*.3;

  if(cameraX<0)cameraX=0;
}

function draw(){

  ctx.fillStyle="#87ceeb";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(100,80,30,0,Math.PI*2);
  ctx.arc(140,70,40,0,Math.PI*2);
  ctx.arc(180,80,25,0,Math.PI*2);

  ctx.fill();

  for(const p of platforms){

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
      p.x-cameraX,
      p.y,
      p.w,
      p.h
    );
  }

  for(const s of spikes){

    ctx.fillStyle="#333";

    ctx.beginPath();

    ctx.moveTo(
      s.x-cameraX,
      s.y+s.h
    );

    ctx.lineTo(
      s.x+s.w/2-cameraX,
      s.y
    );

    ctx.lineTo(
      s.x+s.w-cameraX,
      s.y+s.h
    );

    ctx.closePath();

    ctx.fill();
  }

  const last=platforms[platforms.length-1];

  ctx.fillStyle="#ffd700";

  ctx.fillRect(
    last.x+last.w-10-cameraX,
    last.y-70,
    5,
    70
  );

  ctx.fillStyle="#ff3333";

  ctx.beginPath();

  ctx.moveTo(
    last.x+last.w-5-cameraX,
    last.y-70
  );

  ctx.lineTo(
    last.x+last.w+35-cameraX,
    last.y-55
  );

  ctx.lineTo(
    last.x+last.w-5-cameraX,
    last.y-40
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#ef4444";

  ctx.fillRect(
    player.x-cameraX,
    player.y,
    player.w,
    player.h
  );

  ctx.fillStyle="white";

  ctx.fillRect(
    player.x-cameraX+6,
    player.y+8,
    6,
    6
  );

  ctx.fillRect(
    player.x-cameraX+22,
    player.y+8,
    6,
    6
  );
}

function gameLoop(){

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

createLevel();
gameLoop();

function holdButton(id,setter){

  const button=document.getElementById(id);

  button.addEventListener("touchstart",e=>{
    e.preventDefault();
    setter(true);
  });

  button.addEventListener("touchend",e=>{
    e.preventDefault();
    setter(false);
  });
}

holdButton("left",v=>left=v);
holdButton("right",v=>right=v);

document.getElementById("jump").addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    jump=true;
  }
);

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft"||e.key==="a")left=true;
  if(e.key==="ArrowRight"||e.key==="d")right=true;

  if(
    e.key==="ArrowUp"||
    e.key===" "||
    e.key==="w"
  ){
    jump=true;
  }
});

window.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft"||e.key==="a")left=false;
  if(e.key==="ArrowRight"||e.key==="d")right=false;
});
</script>

</body>
</html>

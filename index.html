<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#03050c;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:radial-gradient(circle,#142c49,#02040a 75%);

}

.box{

  width:88%;

  max-width:470px;

  padding:32px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:24px;

  background:#030817ee;

  box-shadow:0 0 40px #00eaff55;

}

h1{

  color:white;

  font-size:48px;

  line-height:.9;

  letter-spacing:4px;

  text-shadow:0 0 25px #00eaff;

}

.sub{

  color:#00eaff;

  margin:18px 0 28px;

  letter-spacing:5px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:14px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

}

#hud{

  display:none;

  position:fixed;

  z-index:5;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  color:white;

  pointer-events:none;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:140px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#00eaff;

}

#controls{

  display:none;

  position:fixed;

  inset:0;

  z-index:15;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:68px;

  height:68px;

  border-radius:50%;

  border:2px solid #ffffff35;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:bold;

  pointer-events:auto;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:95px;

  bottom:18px;

}

#jump{

  right:100px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:15px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:58px;

  bottom:96px;

  width:54px;

  height:54px;

  font-size:10px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:16;

  right:15px;

  bottom:165px;

  gap:7px;

}

.skill{

  width:60px;

  height:43px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:9px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

/* =========================

   CHARACTER IMAGE

========================= */

const characterImage=new Image();

characterImage.src="character.png";

let characterLoaded=false;

characterImage.onload=function(){

  characterLoaded=true;

};

/* =========================

   INPUT

========================= */

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

let jumpPressed=false;

function bindButton(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",function(e){

    e.preventDefault();

    keys[key]=true;

    if(key==="jump"){

      jumpPressed=true;

    }

    if(key==="attack"){

      attack();

    }

  });

  b.addEventListener("pointerup",function(e){

    e.preventDefault();

    keys[key]=false;

  });

  b.addEventListener("pointercancel",function(){

    keys[key]=false;

  });

}

bindButton("left","left");

bindButton("right","right");

bindButton("jump","jump");

bindButton("attack","attack");

bindButton("dash","dash");

addEventListener("keydown",function(e){

  if(e.code==="ArrowLeft"){

    keys.left=true;

  }

  if(e.code==="ArrowRight"){

    keys.right=true;

  }

  if(e.code==="ArrowUp" || e.code==="Space"){

    if(!keys.jump){

      jumpPressed=true;

    }

    keys.jump=true;

  }

  if(e.code==="KeyJ"){

    attack();

  }

  if(e.code==="ShiftLeft"){

    keys.dash=true;

  }

  if(e.code==="Digit1"){

    useSlash();

  }

  if(e.code==="Digit2"){

    useShuriken();

  }

  if(e.code==="Digit3"){

    useUltimate();

  }

});

addEventListener("keyup",function(e){

  if(e.code==="ArrowLeft"){

    keys.left=false;

  }

  if(e.code==="ArrowRight"){

    keys.right=false;

  }

  if(e.code==="ArrowUp" || e.code==="Space"){

    keys.jump=false;

  }

  if(e.code==="ShiftLeft"){

    keys.dash=false;

  }

});

/* =========================

   GAME DATA

========================= */

let running=false;

let cameraX=0;

let score=0;

let enemies=[];

let particles=[];

let effects=[];

/* =========================

   PLAYER

========================= */

const player={

  x:260,

  y:100,

  w:86,

  h:118,

  vx:0,

  vy:0,

  maxSpeed:4.2,

  acceleration:.38,

  friction:.82,

  gravity:.52,

  jumpPower:10,

  ground:false,

  wall:false,

  wallSide:0,

  jumps:0,

  maxJumps:2,

  direction:1,

  attackTimer:0,

  attackFrame:0,

  slashTimer:0,

  dashTimer:0,

  dashCooldown:0,

  invincible:0,

  walkTime:0,

  flipAngle:0,

  flipActive:false,

  hurtTimer:0

};

/* =========================

   CONSTANT WORLD

========================= */

const FLOOR_HEIGHT=230;

function floorY(){

  return H-FLOOR_HEIGHT;

}

/* =========================

   WALLS

========================= */

const wallList=[];

function createWalls(){

  wallList.length=0;

  for(let i=0;i<60;i++){

    wallList.push({

      x:650+i*850,

      y:floorY()-250,

      w:36,

      h:250

    });

  }

}

/* =========================

   ENEMIES

========================= */

function createEnemies(){

  enemies=[];

  for(let i=0;i<80;i++){

    enemies.push({

      x:1000+i*600,

      y:floorY()-92,

      w:74,

      h:92,

      vx:0,

      hp:100,

      maxHp:100,

      speed:0.8,

      attackTimer:0,

      hitTimer:0,

      deathTimer:0,

      alive:true

    });

  }

}

/* =========================

   PARTICLES

========================= */

function particle(x,y,type="normal"){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-.5)*7,

    vy:(Math.random()-.5)*7,

    life:30,

    type:type

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.12;

    p.life--;

  }

  particles=particles.filter(p=>p.life>0);

}

/* =========================

   BASIC ATTACK

========================= */

function attack(){

  if(player.attackTimer>0){

    return;

  }

  player.attackTimer=28;

  player.attackFrame=0;

  effects.push({

    x:player.x+player.w/2,

    y:player.y+player.h*.42,

    vx:player.direction*5,

    vy:0,

    life:20,

    type:"basicSlash",

    frame:0

  });

}

/* =========================

   SKILL 1

========================= */

let slashCooldown=0;

function useSlash(){

  if(slashCooldown>0){

    return;

  }

  slashCooldown=80;

  player.slashTimer=30;

  for(let i=0;i<20;i++){

    effects.push({

      x:player.x+player.direction*50,

      y:player.y+50,

      vx:player.direction*(3+Math.random()*6),

      vy:(Math.random()-.5)*7,

      life:35,

      type:"slashSkill"

    });

  }

}

/* =========================

   SKILL 2

========================= */

let shurikenCooldown=0;

function useShuriken(){

  if(shurikenCooldown>0){

    return;

  }

  shurikenCooldown=110;

  effects.push({

    x:player.x+player.direction*55,

    y:player.y+42,

    vx:player.direction*11,

    vy:0,

    life:110,

    type:"shuriken"

  });

}

/* =========================

   ULTIMATE

========================= */

let ultimateCooldown=0;

function useUltimate(){

  if(ultimateCooldown>0){

    return;

  }

  ultimateCooldown=360;

  player.invincible=100;

  for(let i=0;i<80;i++){

    effects.push({

      x:player.x+(Math.random()-.5)*500,

      y:player.y+(Math.random()-.5)*350,

      vx:(Math.random()-.5)*9,

      vy:(Math.random()-.5)*9,

      life:65,

      type:"ultimate"

    });

  }

  for(const e of enemies){

    if(

      e.alive &&

      Math.abs(e.x-player.x)<400

    ){

      e.hp-=180;

    }

  }

}

/* =========================

   COLLISION

========================= */

function isInsideWall(x,y,w,h,wall){

  return(

    x<wall.x+wall.w &&

    x+w>wall.x &&

    y<wall.y+wall.h &&

    y+h>wall.y

  );

}

function handleWallCollision(oldX){

  player.wall=false;

  player.wallSide=0;

  for(const wall of wallList){

    if(!isInsideWall(

      player.x,

      player.y,

      player.w,

      player.h,

      wall

    )){

      continue;

    }

    if(oldX+player.w<=wall.x){

      player.x=wall.x-player.w;

      player.vx=0;

      player.wall=true;

      player.wallSide=1;

    }

    else if(oldX>=wall.x+wall.w){

      player.x=wall.x+wall.w;

      player.vx=0;

      player.wall=true;

      player.wallSide=-1;

    }

    else{

      if(player.direction>0){

        player.x=wall.x-player.w;

        player.wallSide=1;

      }

      else{

        player.x=wall.x+wall.w;

        player.wallSide=-1;

      }

      player.vx=0;

      player.wall=true;

    }

  }

}

/* =========================

   JUMP

========================= */

function doJump(){

  if(player.wall){

    player.vy=-8.5;

    player.vx=-player.wallSide*6;

    player.wall=false;

    player.ground=false;

    player.jumps=1;

    player.flipActive=true;

    player.flipAngle=0;

    return;

  }

  if(player.ground){

    player.vy=-player.jumpPower;

    player.ground=false;

    player.jumps=1;

    player.flipActive=true;

    player.flipAngle=0;

    return;

  }

  if(player.jumps<player.maxJumps){

    player.vy=-9;

    player.jumps++;

    player.flipActive=true;

    player.flipAngle=0;

  }

}

/* =========================

   PLAYER UPDATE

========================= */

function updatePlayer(){

  const oldX=player.x;

  let move=0;

  if(keys.left){

    move--;

  }

  if(keys.right){

    move++;

  }

  if(move!==0){

    player.vx+=move*player.acceleration;

    player.direction=move;

    player.walkTime+=Math.abs(player.vx)*.18;

  }

  else{

    player.vx*=player.friction;

  }

  player.vx=Math.max(

    -player.maxSpeed,

    Math.min(player.maxSpeed,player.vx)

  );

  if(jumpPressed){

    doJump();

    jumpPressed=false;

  }

  if(player.wall && !player.ground){

    if(player.vy>1.5){

      player.vy=1.5;

    }

  }

  else{

    player.vy+=player.gravity;

  }

  if(keys.dash && player.dashCooldown<=0){

    player.dashTimer=14;

    player.dashCooldown=50;

    player.vx=player.direction*10;

    player.vy*=.2;

    player.invincible=25;

    for(let i=0;i<12;i++){

      particle(player.x,player.y+60,"dash");

    }

  }

  if(player.dashTimer>0){

    player.dashTimer--;

  }

  if(player.dashCooldown>0){

    player.dashCooldown--;

  }

  if(player.attackTimer>0){

    player.attackTimer--;

    player.attackFrame++;

  }

  if(player.slashTimer>0){

    player.slashTimer--;

  }

  if(player.invincible>0){

    player.invincible--;

  }

  player.x+=player.vx;

  handleWallCollision(oldX);

  player.y+=player.vy;

  /* 바닥 충돌 */

  const ground=floorY();

  if(player.y+player.h>=ground){

    player.y=ground-player.h;

    player.vy=0;

    if(!player.ground){

      player.jumps=0;

    }

    player.ground=true;

    player.flipActive=false;

    player.flipAngle=0;

  }

  else{

    player.ground=false;

  }

  /* 벽에 붙어있는 동안 */

  if(player.wall && !player.ground){

    if(player.vy>1.5){

      player.vy=1.5;

    }

  }

  /* 플립 */

  if(player.flipActive){

    player.flipAngle+=.35;

    if(player.flipAngle>=Math.PI*2){

      player.flipAngle=Math.PI*2;

      player.flipActive=false;

    }

  }

  /* 떨어짐 */

  if(player.y>H+300){

    player.hp-=15;

    player.x=Math.max(

      100,

      player.x-300

    );

    player.y=ground-player.h;

    player.vy=0;

    player.jumps=0;

  }

  cameraX=player.x-W*.32;

  if(cameraX<0){

    cameraX=0;

  }

}

/* =========================

   ENEMY UPDATE

========================= */

function updateEnemies(){

  for(const e of enemies){

    if(!e.alive){

      continue;

    }

    if(e.hp<=0){

      e.deathTimer++;

      if(e.deathTimer>30){

        e.alive=false;

        score+=150;

      }

      continue;

    }

    const dx=player.x-e.x;

    const d=Math.abs(dx);

    if(d<550){

      e.x+=Math.sign(dx)*e.speed;

    }

    if(e.attackTimer>0){

      e.attackTimer--;

    }

    if(

      d<100 &&

      Math.abs(player.y-e.y)<110 &&

      e.attackTimer<=0

    ){

      if(player.invincible<=0){

        player.hp-=10;

        player.invincible=45;

        player.hurtTimer=15;

      }

      e.attackTimer=70;

    }

    if(

      player.attackTimer>5 &&

      d<135 &&

      Math.abs(player.y-e.y)<120

    ){

      e.hp-=35;

      e.hitTimer=10;

    }

    if(

      player.slashTimer>0 &&

      d<180 &&

      Math.abs(player.y-e.y)<140

    ){

      e.hp-=8;

    }

    for(const s of effects){

      if(

        s.type==="shuriken" &&

        Math.abs(s.x-e.x)<60 &&

        Math.abs(s.y-e.y)<80

      ){

        e.hp-=55;

        s.life=0;

      }

    }

    if(e.hitTimer>0){

      e.hitTimer--;

    }

  }

}

/* =========================

   EFFECT UPDATE

========================= */

function updateEffects(){

  for(const s of effects){

    s.x+=s.vx;

    s.y+=s.vy;

    s.life--;

    if(s.type==="shuriken"){

      s.vy+=.03;

    }

  }

  effects=effects.filter(s=>s.life>0);

}

/* =========================

   BACKGROUND

========================= */

function drawBackground(){

  const g=ctx.createLinearGradient(

    0,

    0,

    0,

    H

  );

  g.addColorStop(0,"#050817");

  g.addColorStop(1,"#160b25");

  ctx.fillStyle=g;

  ctx.fillRect(

    0,

    0,

    W,

    H

  );

  ctx.fillStyle="#e8ffff";

  ctx.shadowBlur=25;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*.78,

    85,

    38,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  for(let i=0;i<35;i++){

    const x=

      ((i*180-cameraX*.16)%(W+400))-200;

    const h=

      100+(i*67)%300;

    ctx.fillStyle=

      i%3===0

      ?"#0b1830"

      :"#080d20";

    ctx.fillRect(

      x,

      floorY()-h,

      120,

      h

    );

  }

}

/* =========================

   FLOOR

========================= */

function drawFloor(){

  const y=floorY();

  ctx.fillStyle="#080d18";

  ctx.fillRect(

    0,

    y,

    W,

    H-y

  );

  ctx.fillStyle="#061a2b";

  ctx.fillRect(

    0,

    y,

    W,

    12

  );

  ctx.fillStyle="#00eaff";

  ctx.shadowBlur=14;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    0,

    y,

    W,

    4

  );

  ctx.shadowBlur=0;

  for(

    let x=-cameraX%80;

    x<W;

    x+=80

  ){

    ctx.strokeStyle="#10283c";

    ctx.beginPath();

    ctx.moveTo(

      x,

      y+15

    );

    ctx.lineTo(

      x,

      H

    );

    ctx.stroke();

  }

}

/* =========================

   WALL DRAW

========================= */

function drawWalls(){

  for(const wall of wallList){

    const x=wall.x-cameraX;

    if(

      x<-60 ||

      x>W+60

    ){

      continue;

    }

    ctx.fillStyle="#090d1c";

    ctx.fillRect(

      x,

      wall.y,

      wall.w,

      wall.h

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.shadowBlur=12;

    ctx.shadowColor="#00eaff";

    ctx.strokeRect(

      x,

      wall.y,

      wall.w,

      wall.h

    );

    ctx.shadowBlur=0;

  }

}

/* =========================

   PLAYER DRAW

========================= */

function drawPlayer(){

  const x=

    player.x-player.w*.15-cameraX;

  const y=player.y;

  ctx.save();

  ctx.translate(

    x+player.w/2,

    y+player.h/2

  );

  if(player.direction<0){

    ctx.scale(-1,1);

  }

  if(player.flipActive){

    ctx.rotate(player.flipAngle);

  }

  if(

    player.invincible>0 &&

    Math.floor(player.invincible/4)%2===0

  ){

    ctx.globalAlpha=.45;

  }

  /*

    실제 character.png가 있으면 사용

  */

  if(characterLoaded){

    const size=125;

    ctx.drawImage(

      characterImage,

      -size/2,

      -size/2,

      size,

      size

    );

  }

  else{

    /*

      이미지가 아직 없을 때

      임시 닌자

    */

    drawFallbackNinja();

  }

  /*

    공격 애니메이션

  */

  if(player.attackTimer>0){

    const progress=

      1-player.attackTimer/28;

    ctx.save();

    ctx.rotate(

      -1.1+progress*2.4

    );

    ctx.strokeStyle="white";

    ctx.lineWidth=8;

    ctx.shadowBlur=25;

    ctx.shadowColor="#00eaff";

    ctx.beginPath();

    ctx.moveTo(

      25,

      -10

    );

    ctx.lineTo(

      100,

      -65

    );

    ctx.stroke();

    ctx.restore();

  }

  /*

    벽타기 이펙트

  */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(

      -55,

      -25

    );

    ctx.lineTo(

      -85,

      -40

    );

    ctx.moveTo(

      -55,

      5

    );

    ctx.lineTo(

      -85,

      -5

    );

    ctx.stroke();

  }

  ctx.restore();

}

/* =========================

   FALLBACK CHARACTER

========================= */

function drawFallbackNinja(){

  const walk=

    player.ground

    ?Math.sin(player.walkTime)*8

    :0;

  ctx.fillStyle="#030509";

  ctx.beginPath();

  ctx.arc(

    0,

    -42,

    31,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.stroke();

  ctx.fillStyle="#9fffff";

  ctx.shadowBlur=15;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    -20,

    -47,

    15,

    6

  );

  ctx.fillRect(

    5,

    -47,

    15,

    6

  );

  ctx.shadowBlur=0;

  ctx.fillStyle="#020306";

  ctx.fillRect(

    -28,

    -15,

    56,

    58

  );

  ctx.strokeStyle="#00eaff";

  ctx.strokeRect(

    -28,

    -15,

    56,

    58

  );

  ctx.strokeStyle="#020306";

  ctx.lineWidth=14;

  ctx.beginPath();

  ctx.moveTo(

    -20,

    -5

  );

  ctx.lineTo(

    -52,

    20+walk

  );

  ctx.moveTo(

    20,

    -5

  );

  ctx.lineTo(

    52,

    20-walk

  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(

    -14,

    40

  );

  ctx.lineTo(

    -28+walk,

    75

  );

  ctx.moveTo(

    14,

    40

  );

  ctx.lineTo(

    28-walk,

    75

  );

  ctx.stroke();

}

/* =========================

   ENEMY DRAW

========================= */

function drawEnemies(){

  for(const e of enemies){

    if(!e.alive){

      continue;

    }

    const x=e.x-cameraX;

    const y=e.y;

    ctx.save();

    ctx.translate(

      x+e.w/2,

      y+e.h/2

    );

    if(e.hitTimer>0){

      ctx.translate(

        (Math.random()-.5)*5,

        0

      );

    }

    ctx.fillStyle="#05070c";

    ctx.fillRect(

      -35,

      -15,

      70,

      80

    );

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=4;

    ctx.strokeRect(

      -35,

      -15,

      70,

      80

    );

    ctx.beginPath();

    ctx.arc(

      0,

      -35,

      32,

      0,

      Math.PI*2

    );

    ctx.fill();

    ctx.stroke();

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=18;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      -20,

      -42,

      14,

      6

    );

    ctx.fillRect(

      6,

      -42,

      14,

      6

    );

    ctx.shadowBlur=0;

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(

      25,

      5

    );

    ctx.lineTo(

      70,

      -40

    );

    ctx.stroke();

    ctx.fillStyle="#250814";

    ctx.fillRect(

      -35,

      -65,

      70,

      7

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      -35,

      -65,

      70*(e.hp/e.maxHp),

      7

    );

    ctx.restore();

  }

}

/* =========================

   EFFECT DRAW

========================= */

function drawEffects(){

  for(const s of effects){

    ctx.save();

    ctx.translate(

      s.x-cameraX,

      s.y

    );

    if(s.type==="basicSlash"){

      const p=

        1-s.life/20;

      ctx.rotate(

        -1.3+p*2.6

      );

      ctx.strokeStyle="#ffffff";

      ctx.lineWidth=8;

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        60,

        -.9,

        .9

      );

      ctx.stroke();

    }

    if(s.type==="slashSkill"){

      ctx.strokeStyle="#00eaff";

      ctx.lineWidth=7;

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        45,

        -.9,

        .9

      );

      ctx.stroke();

    }

    if(s.type==="shuriken"){

      ctx.rotate(

        Date.now()*.025

      );

      ctx.strokeStyle="white";

      ctx.lineWidth=4;

      ctx.shadowBlur=20;

      ctx.shadowColor="#00eaff";

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(

          0,

          0

        );

        ctx.lineTo(

          30,

          0

        );

        ctx.stroke();

      }

    }

    if(s.type==="ultimate"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=30;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        8+s.life*.3,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

/* =========================

   PARTICLE DRAW

========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life/30;

    ctx.fillStyle=

      p.type==="enemy"

      ?"#ff3972"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      6,

      6

    );

  }

  ctx.globalAlpha=1;

}

/* =========================

   UPDATE

========================= */

function update(){

  if(!running){

    return;

  }

  updatePlayer();

  updateEnemies();

  updateEffects();

  updateParticles();

  if(slashCooldown>0){

    slashCooldown--;

  }

  if(shurikenCooldown>0){

    shurikenCooldown--;

  }

  if(ultimateCooldown>0){

    ultimateCooldown--;

  }

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById("score")

  .textContent=score;

  document.getElementById("hp")

  .style.width=

    Math.max(0,player.hp)+"%";

  document.getElementById("skill1")

  .textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById("skill2")

  .textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById("skill3")

  .textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(player.hp<=0){

    running=false;

    setTimeout(function(){

      alert("MISSION FAILED!");

      location.reload();

    },100);

  }

}

/* =========================

   DRAW

========================= */

function draw(){

  drawBackground();

  drawFloor();

  drawWalls();

  drawEnemies();

  drawEffects();

  drawPlayer();

  drawParticles();

}

/* =========================

   START

========================= */

document.getElementById("start")

.addEventListener("click",function(){

  running=true;

  createWalls();

  createEnemies();

  document.getElementById("menu")

  .style.display="none";

  document.getElementById("hud")

  .style.display="flex";

  document.getElementById("controls")

  .style.display="block";

  document.getElementById("skills")

  .style.display="flex";

});

createWalls();

createEnemies();

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#02040a;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:

    radial-gradient(circle at 50% 35%,#123c58,#050b16 45%,#02040a 80%);

}

.box{

  width:88%;

  max-width:480px;

  padding:32px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:25px;

  background:#030817ee;

  box-shadow:0 0 45px #00eaff55;

}

h1{

  color:white;

  font-size:48px;

  line-height:.9;

  letter-spacing:5px;

  text-shadow:0 0 25px #00eaff;

}

.sub{

  color:#00eaff;

  margin:18px 0 28px;

  letter-spacing:6px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:15px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

  box-shadow:0 0 25px #00eaff55;

}

#hud{

  display:none;

  position:fixed;

  z-index:10;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  pointer-events:none;

  color:white;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:150px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#ff3972;

}

#controls{

  display:none;

  position:fixed;

  z-index:11;

  inset:0;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:70px;

  height:70px;

  border-radius:50%;

  border:2px solid #ffffff33;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  font-weight:bold;

  pointer-events:auto;

  box-shadow:0 0 15px #00eaff22;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:98px;

  bottom:18px;

}

#jump{

  right:105px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:18px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:60px;

  bottom:100px;

  width:56px;

  height:56px;

  font-size:11px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:12;

  right:15px;

  bottom:170px;

  gap:7px;

}

.skill{

  width:62px;

  height:45px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:10px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

function button(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",function(e){

    e.preventDefault();

    keys[key]=true;

  });

  b.addEventListener("pointerup",function(e){

    e.preventDefault();

    keys[key]=false;

  });

  b.addEventListener("pointercancel",function(){

    keys[key]=false;

  });

  b.addEventListener("pointerleave",function(){

    keys[key]=false;

  });

}

button("left","left");

button("right","right");

button("jump","jump");

button("attack","attack");

button("dash","dash");

addEventListener("keydown",function(e){

  if(e.code==="ArrowLeft")keys.left=true;

  if(e.code==="ArrowRight")keys.right=true;

  if(e.code==="ArrowUp" || e.code==="Space"){

    keys.jump=true;

  }

  if(e.code==="KeyJ"){

    keys.attack=true;

  }

  if(e.code==="ShiftLeft"){

    keys.dash=true;

  }

});

addEventListener("keyup",function(e){

  if(e.code==="ArrowLeft")keys.left=false;

  if(e.code==="ArrowRight")keys.right=false;

  if(e.code==="ArrowUp" || e.code==="Space"){

    keys.jump=false;

  }

  if(e.code==="KeyJ"){

    keys.attack=false;

  }

  if(e.code==="ShiftLeft"){

    keys.dash=false;

  }

});

let running=false;

let cameraX=0;

let score=0;

let shake=0;

let flash=0;

let platforms=[];

let walls=[];

let enemies=[];

let effects=[];

let particles=[];

let slashCooldown=0;

let shurikenCooldown=0;

let ultimateCooldown=0;

/* =========================

   PLAYER

========================= */

const player={

  x:160,

  y:200,

  w:62,

  h:92,

  vx:0,

  vy:0,

  maxSpeed:5.2,

  acceleration:.65,

  friction:.78,

  jumpPower:11.5,

  gravity:.55,

  ground:false,

  wall:false,

  wallSide:0,

  jumps:0,

  maxJumps:2,

  direction:1,

  attack:0,

  dash:0,

  invincible:0,

  anim:0,

  flip:0,

  jumpAnimation:0,

  attackAnimation:0,

  walkCycle:0

};

/* =========================

   WORLD

========================= */

function createWorld(){

  platforms=[];

  walls=[];

  enemies=[];

  const floorY=H-90;

  /*

    끊기지 않는 바닥

  */

  platforms.push({

    x:-5000,

    y:floorY,

    w:30000,

    h:100

  });

  /*

    벽

  */

  for(let i=0;i<40;i++){

    if(i%3===0){

      walls.push({

        x:700+i*600,

        y:floorY-230,

        w:34,

        h:230

      });

    }

  }

  /*

    적

  */

  for(let i=0;i<35;i++){

    enemies.push({

      x:650+i*430,

      y:floorY-62,

      w:50,

      h:62,

      hp:70,

      maxHp:70,

      speed:1.1,

      attack:0,

      direction:-1,

      anim:0

    });

  }

}

/* =========================

   PARTICLES

========================= */

function particle(x,y,type){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-.5)*7,

    vy:(Math.random()-.5)*7,

    life:35,

    type:type || "normal"

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.08;

    p.life--;

  }

  particles=particles.filter(p=>p.life>0);

}

/* =========================

   SKILLS

========================= */

function useSlash(){

  if(slashCooldown>0)return;

  slashCooldown=42;

  player.attack=22;

  player.attackAnimation=22;

  player.vx=player.direction*5.5;

  shake=4;

  for(let i=0;i<16;i++){

    effects.push({

      x:player.x+player.direction*45,

      y:player.y+40,

      vx:player.direction*(2+i*.25),

      vy:(Math.random()-.5)*5,

      life:25,

      type:"slash"

    });

  }

}

function useShuriken(){

  if(shurikenCooldown>0)return;

  shurikenCooldown=85;

  effects.push({

    x:player.x+player.direction*55,

    y:player.y+35,

    vx:player.direction*11,

    vy:0,

    life:100,

    type:"shuriken"

  });

}

function useUltimate(){

  if(ultimateCooldown>0)return;

  ultimateCooldown=280;

  player.invincible=100;

  shake=12;

  flash=10;

  for(let i=0;i<55;i++){

    effects.push({

      x:player.x+(Math.random()-.5)*400,

      y:player.y+(Math.random()-.5)*250,

      vx:(Math.random()-.5)*12,

      vy:(Math.random()-.5)*12,

      life:55,

      type:"ult"

    });

  }

  for(const e of enemies){

    if(Math.abs(e.x-player.x)<330){

      e.hp-=150;

    }

  }

}

document.getElementById("skill1").addEventListener("pointerdown",useSlash);

document.getElementById("skill2").addEventListener("pointerdown",useShuriken);

document.getElementById("skill3").addEventListener("pointerdown",useUltimate);

/* =========================

   WALL CHECK

========================= */

function checkWall(){

  player.wall=false;

  player.wallSide=0;

  for(const w of walls){

    const hit=

      player.x+player.w>w.x &&

      player.x<w.x+w.w &&

      player.y+player.h>w.y &&

      player.y<w.y+w.h;

    if(hit){

      player.wall=true;

      if(player.x+w.w/2<w.x+w.w/2){

        player.wallSide=-1;

      }else{

        player.wallSide=1;

      }

      return;

    }

  }

}

/* =========================

   PLAYER UPDATE

========================= */

function updatePlayer(){

  let move=0;

  if(keys.left)move--;

  if(keys.right)move++;

  /*

    이동

  */

  if(move!==0){

    player.vx+=move*player.acceleration;

    player.direction=move;

    player.walkCycle+=.22;

  }else{

    player.vx*=player.friction;

  }

  player.vx=Math.max(

    -player.maxSpeed,

    Math.min(player.maxSpeed,player.vx)

  );

  checkWall();

  /*

    벽타기

  */

  if(player.wall && !player.ground){

    if(player.vy>2.2){

      player.vy=2.2;

    }

    if(keys.jump){

      player.vy=-9.5;

      player.vx=-player.wallSide*5;

      player.jumps=1;

      player.wall=false;

      player.flip=0;

    }

  }

  /*

    점프

  */

  if(keys.jump && !player.jumpPressed){

    player.jumpPressed=true;

    if(player.ground){

      player.vy=-player.jumpPower;

      player.ground=false;

      player.jumps=1;

      player.jumpAnimation=1;

      player.flip=0;

    }else if(player.jumps<player.maxJumps){

      player.vy=-10;

      player.jumps++;

      player.jumpAnimation=1;

      player.flip=0;

    }

  }

  if(!keys.jump){

    player.jumpPressed=false;

  }

  /*

    부드러운 프런트 플립

  */

  if(!player.ground && !player.wall){

    player.flip+=.18;

    if(player.flip>Math.PI*2){

      player.flip=Math.PI*2;

    }

  }

  /*

    공격

  */

  if(keys.attack && player.attack<=0){

    useSlash();

  }

  /*

    대시

  */

  if(keys.dash && player.dash<=0){

    player.vx=player.direction*11;

    player.dash=15;

    player.invincible=25;

    shake=5;

    for(let i=0;i<10;i++){

      particle(

        player.x,

        player.y+45,

        "dash"

      );

    }

  }

  if(player.attack>0)player.attack--;

  if(player.dash>0)player.dash--;

  if(player.invincible>0)player.invincible--;

  if(slashCooldown>0)slashCooldown--;

  if(shurikenCooldown>0)shurikenCooldown--;

  if(ultimateCooldown>0)ultimateCooldown--;

  /*

    중력

  */

  if(player.wall && !player.ground){

    player.vy+=.16;

  }else{

    player.vy+=player.gravity;

  }

  /*

    이동 전 위치

  */

  const oldX=player.x;

  const oldY=player.y;

  player.x+=player.vx;

  /*

    벽 충돌

    좌우 이동 후 즉시 교정

  */

  for(const w of walls){

    const hit=

      player.x+player.w>w.x &&

      player.x<w.x+w.w &&

      player.y+player.h>w.y+4 &&

      player.y<w.y+w.h;

    if(hit){

      if(oldX+player.w<=w.x){

        player.x=w.x-player.w;

      }else if(oldX>=w.x+w.w){

        player.x=w.x+w.w;

      }

      player.vx=0;

    }

  }

  player.y+=player.vy;

  /*

    바닥 충돌

  */

  player.ground=false;

  for(const p of platforms){

    const horizontal=

      player.x+player.w>p.x &&

      player.x<p.x+p.w;

    const falling=

      player.vy>=0;

    const crossed=

      oldY+player.h<=p.y &&

      player.y+player.h>=p.y;

    if(horizontal && falling && crossed){

      player.y=p.y-player.h;

      player.vy=0;

      player.ground=true;

      player.jumps=0;

      player.flip=0;

    }

  }

  /*

    벽 충돌 위아래

  */

  for(const w of walls){

    const hit=

      player.x+player.w>w.x &&

      player.x<w.x+w.w &&

      player.y+player.h>w.y &&

      player.y<w.y+w.h;

    if(hit){

      if(oldY+player.h<=w.y){

        player.y=w.y-player.h;

        player.vy=0;

        player.ground=true;

        player.jumps=0;

      }

      if(oldY>=w.y+w.h){

        player.y=w.y+w.h;

        player.vy=0;

      }

    }

  }

  /*

    낙사 방지

  */

  if(player.y>H+300){

    player.hp-=20;

    player.x=Math.max(100,player.x-250);

    player.y=H-250;

    player.vy=0;

  }

  /*

    카메라

  */

  const targetCamera=player.x-W*.32;

  cameraX+=(targetCamera-cameraX)*.08;

}

/* =========================

   ENEMIES

========================= */

function updateEnemies(){

  for(const e of [...enemies]){

    const dx=player.x-e.x;

    const d=Math.abs(dx);

    e.anim+=.12;

    if(d<450){

      e.direction=dx>0?1:-1;

      e.x+=e.direction*e.speed;

    }

    if(e.attack>0)e.attack--;

    if(

      d<70 &&

      Math.abs(player.y-e.y)<75 &&

      e.attack<=0

    ){

      if(player.invincible<=0){

        player.hp-=10;

        player.invincible=40;

        flash=6;

      }

      e.attack=65;

    }

    if(

      player.attack>0 &&

      d<115 &&

      Math.abs(player.y-e.y)<85

    ){

      e.hp-=30;

    }

    for(const s of effects){

      if(

        s.type==="slash" &&

        Math.abs(s.x-e.x)<75 &&

        Math.abs(s.y-e.y)<80

      ){

        e.hp-=8;

      }

      if(

        s.type==="shuriken" &&

        Math.abs(s.x-e.x)<50 &&

        Math.abs(s.y-e.y)<60

      ){

        e.hp-=45;

        s.life=0;

      }

    }

    if(e.hp<=0){

      score+=150;

      for(let i=0;i<20;i++){

        particle(e.x,e.y);

      }

      enemies.splice(

        enemies.indexOf(e),

        1

      );

    }

  }

}

/* =========================

   EFFECTS

========================= */

function updateEffects(){

  for(const s of effects){

    s.x+=s.vx;

    s.y+=s.vy;

    s.life--;

    if(s.type==="boss"){

      s.vy+=.02;

    }

  }

  effects=effects.filter(s=>s.life>0);

}

/* =========================

   BACKGROUND

========================= */

function drawBackground(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#030817");

  g.addColorStop(1,"#130a21");

  ctx.fillStyle=g;

  ctx.fillRect(0,0,W,H);

  /*

    별

  */

  for(let i=0;i<60;i++){

    const x=((i*137-cameraX*.08)%(W+200))-100;

    const y=(i*83)%Math.max(150,H-150);

    ctx.fillStyle="#ffffff88";

    ctx.fillRect(x,y,2,2);

  }

  /*

    달

  */

  ctx.fillStyle="#dfffff";

  ctx.shadowBlur=30;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*.78,

    90,

    38,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*

    도시

  */

  for(let i=0;i<40;i++){

    const x=

      ((i*145-cameraX*.18)%(W+300))-150;

    const h=

      90+(i*71)%280;

    ctx.fillStyle=

      i%3===0

      ?"#0a1830"

      :"#070d20";

    ctx.fillRect(

      x,

      H-90-h,

      85,

      h

    );

    for(let j=0;j<5;j++){

      if((i+j)%2===0){

        ctx.fillStyle="#00d9ff55";

        ctx.fillRect(

          x+12,

          H-75-h+j*38,

          8,

          15

        );

      }

    }

  }

}

/* =========================

   WORLD DRAW

========================= */

function drawWorld(){

  for(const p of platforms){

    ctx.fillStyle="#081225";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      p.w,

      p.h

    );

    ctx.fillStyle="#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      p.w,

      4

    );

    ctx.fillStyle="#18304b";

    ctx.fillRect(

      p.x-cameraX,

      p.y+12,

      p.w,

      4

    );

  }

  for(const w of walls){

    ctx.fillStyle="#070c18";

    ctx.fillRect(

      w.x-cameraX,

      w.y,

      w.w,

      w.h

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.shadowBlur=14;

    ctx.shadowColor="#00eaff";

    ctx.strokeRect(

      w.x-cameraX,

      w.y,

      w.w,

      w.h

    );

    ctx.shadowBlur=0;

  }

}

/* =========================

   ENEMY DRAW

========================= */

function drawEnemies(){

  for(const e of enemies){

    const x=e.x-cameraX;

    const y=e.y;

    const walk=

      Math.sin(e.anim)*5;

    ctx.save();

    ctx.translate(x,y);

    if(e.direction<0){

      ctx.scale(-1,1);

    }

    /*

      다리

    */

    ctx.strokeStyle="#020307";

    ctx.lineWidth=12;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(18,45);

    ctx.lineTo(10+walk,61);

    ctx.moveTo(32,45);

    ctx.lineTo(40-walk,61);

    ctx.stroke();

    /*

      몸

    */

    ctx.fillStyle="#03050a";

    ctx.fillRect(

      9,

      20,

      34,

      34

    );

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=2;

    ctx.strokeRect(

      9,

      20,

      34,

      34

    );

    /*

      머리

    */

    ctx.fillStyle="#020307";

    ctx.beginPath();

    ctx.arc(

      26,

      15,

      18,

      0,

      Math.PI*2

    );

    ctx.fill();

    ctx.strokeStyle="#ff3972";

    ctx.stroke();

    /*

      눈

    */

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      15,

      11,

      9,

      4

    );

    ctx.fillRect(

      28,

      11,

      9,

      4

    );

    ctx.shadowBlur=0;

    /*

      팔

    */

    ctx.strokeStyle="#020307";

    ctx.lineWidth=10;

    ctx.beginPath();

    ctx.moveTo(11,25);

    ctx.lineTo(-3,40);

    ctx.moveTo(41,25);

    ctx.lineTo(55,37);

    ctx.stroke();

    /*

      체력

    */

    ctx.fillStyle="#250712";

    ctx.fillRect(

      0,

      -12,

      52,

      5

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      0,

      -12,

      52*(e.hp/e.maxHp),

      5

    );

    ctx.restore();

  }

}

/* =========================

   PLAYER DRAW

========================= */

function drawPlayer(){

  const x=player.x-cameraX;

  const y=player.y;

  ctx.save();

  ctx.translate(

    x+player.w/2,

    y+player.h/2

  );

  /*

    방향

  */

  if(player.direction<0){

    ctx.scale(-1,1);

  }

  /*

    점프 플립

  */

  if(!player.ground && !player.wall){

    ctx.rotate(

      Math.min(player.flip,Math.PI*2)

    );

  }

  /*

    무적 깜빡임

  */

  if(

    player.invincible>0 &&

    Math.floor(player.invincible/4)%2===0

  ){

    ctx.globalAlpha=.5;

  }

  /*

    걷기 애니메이션

  */

  let legMove=0;

  let armMove=0;

  let bodyMove=0;

  if(player.ground && Math.abs(player.vx)>.35){

    legMove=Math.sin(player.walkCycle)*9;

    armMove=Math.sin(player.walkCycle)*7;

    bodyMove=Math.sin(player.walkCycle*2)*2;

  }

  /*

    대시 잔상

  */

  if(player.dash>0){

    for(let i=1;i<6;i++){

      ctx.globalAlpha=.12;

      ctx.fillStyle="#00eaff";

      ctx.beginPath();

      ctx.arc(

        -i*15,

        0,

        25,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.globalAlpha=1;

  }

  /*

    스카프 뒤쪽

  */

  ctx.fillStyle="#00cfff";

  ctx.shadowBlur=18;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.moveTo(-22,-18);

  ctx.quadraticCurveTo(

    -50,-5,

    -65,25

  );

  ctx.lineTo(-30,10);

  ctx.lineTo(-10,-5);

  ctx.fill();

  ctx.shadowBlur=0;

  /*

    다리

  */

  ctx.strokeStyle="#010207";

  ctx.lineWidth=15;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-13,25);

  ctx.lineTo(

    -22+legMove,

    55

  );

  ctx.moveTo(13,25);

  ctx.lineTo(

    23-legMove,

    55

  );

  ctx.stroke();

  /*

    다리 청록 라인

  */

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-13,25);

  ctx.lineTo(

    -22+legMove,

    55

  );

  ctx.moveTo(13,25);

  ctx.lineTo(

    23-legMove,

    55

  );

  ctx.stroke();

  /*

    몸통

  */

  ctx.fillStyle="#020306";

  ctx.fillRect(

    -24,

    -12+bodyMove,

    48,

    45

  );

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.strokeRect(

    -24,

    -12+bodyMove,

    48,

    45

  );

  /*

    팔

  */

  ctx.strokeStyle="#010207";

  ctx.lineWidth=14;

  ctx.beginPath();

  ctx.moveTo(-18,-5);

  ctx.lineTo(

    -42,

    14+armMove

  );

  ctx.moveTo(18,-5);

  ctx.lineTo(

    42,

    13-armMove

  );

  ctx.stroke();

  /*

    팔 라인

  */

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-18,-5);

  ctx.lineTo(

    -42,

    14+armMove

  );

  ctx.moveTo(18,-5);

  ctx.lineTo(

    42,

    13-armMove

  );

  ctx.stroke();

  /*

    머리

  */

  ctx.fillStyle="#020306";

  ctx.beginPath();

  ctx.arc(

    0,

    -30,

    29,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.shadowBlur=14;

  ctx.shadowColor="#00eaff";

  ctx.stroke();

  ctx.shadowBlur=0;

  /*

    눈

  */

  ctx.fillStyle="#aaffff";

  ctx.shadowBlur=18;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    -17,

    -34,

    13,

    6

  );

  ctx.fillRect(

    4,

    -34,

    13,

    6

  );

  ctx.shadowBlur=0;

  /*

    검

  */

  let swordAngle=0;

  if(player.attack>0){

    swordAngle=

      Math.sin(

        player.attackAnimation*.35

      )*1.4;

  }

  ctx.save();

  ctx.translate(28,8);

  ctx.rotate(swordAngle);

  ctx.strokeStyle="white";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(0,0);

  ctx.lineTo(65,-45);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(0,0);

  ctx.lineTo(65,-45);

  ctx.stroke();

  ctx.restore();

  /*

    공격 궤적

  */

  if(player.attack>0){

    ctx.strokeStyle="#00eaff";

    ctx.shadowBlur=30;

    ctx.shadowColor="#00eaff";

    ctx.lineWidth=9;

    ctx.beginPath();

    ctx.arc(

      15,

      5,

      62,

      -.95,

      .9

    );

    ctx.stroke();

    ctx.strokeStyle="white";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(

      15,

      5,

      70,

      -.75,

      .55

    );

    ctx.stroke();

    ctx.shadowBlur=0;

  }

  /*

    벽타기 효과

  */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(

      -28,

      -10

    );

    ctx.lineTo(

      -48,

      -20

    );

    ctx.moveTo(

      -28,

      10

    );

    ctx.lineTo(

      -50,

      5

    );

    ctx.stroke();

  }

  ctx.restore();

}

/* =========================

   EFFECT DRAW

========================= */

function drawEffects(){

  for(const s of effects){

    ctx.save();

    ctx.translate(

      s.x-cameraX,

      s.y

    );

    if(s.type==="slash"){

      ctx.strokeStyle="#00eaff";

      ctx.shadowBlur=20;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        35,

        -.8,

        .8

      );

      ctx.stroke();

    }

    if(s.type==="shuriken"){

      ctx.strokeStyle="white";

      ctx.shadowBlur=15;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=4;

      ctx.rotate(Date.now()*.02);

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(23,0);

        ctx.stroke();

      }

    }

    if(s.type==="ult"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,

        0,

        6+s.life*.25,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

/* =========================

   PARTICLE DRAW

========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life/35;

    ctx.fillStyle=

      p.type==="dash"

      ?"#8c5cff"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      5,

      5

    );

  }

  ctx.globalAlpha=1;

}

/* =========================

   UPDATE

========================= */

function update(){

  if(!running)return;

  updatePlayer();

  updateEnemies();

  updateEffects();

  updateParticles();

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById("score").textContent=score;

  document.getElementById("hp").style.width=

    Math.max(0,player.hp)+"%";

  document.getElementById("skill1").textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById("skill2").textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById("skill3").textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(shake>0){

    shake*=.86;

  }

  if(flash>0){

    flash--;

  }

  if(player.hp<=0){

    running=false;

    setTimeout(function(){

      alert("MISSION FAILED");

      location.reload();

    },100);

  }

}

/* =========================

   DRAW

========================= */

function draw(){

  ctx.save();

  if(shake>0){

    ctx.translate(

      (Math.random()-.5)*shake,

      (Math.random()-.5)*shake

    );

  }

  drawBackground();

  drawWorld();

  drawEnemies();

  drawEffects();

  drawPlayer();

  drawParticles();

  ctx.restore();

  if(flash>0){

    ctx.fillStyle="rgba(255,0,70,.1)";

    ctx.fillRect(

      0,

      0,

      W,

      H

    );

  }

}

/* =========================

   START

========================= */

function startGame(e){

  if(e){

    e.preventDefault();

  }

  if(running)return;

  running=true;

  score=0;

  player.x=160;

  player.y=H-300;

  player.vx=0;

  player.vy=0;

  player.hp=100;

  player.ground=false;

  player.jumps=0;

  player.flip=0;

  cameraX=0;

  createWorld();

  document.getElementById("menu").style.display="none";

  document.getElementById("hud").style.display="flex";

  document.getElementById("controls").style.display="block";

  document.getElementById("skills").style.display="flex";

}

/*

  모바일에서 click 대신

  pointerdown도 확실하게 받음

*/

document.getElementById("start")

.addEventListener("pointerdown",startGame);

document.getElementById("start")

.addEventListener("click",startGame);

/* =========================

   LOOP

========================= */

createWorld();

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

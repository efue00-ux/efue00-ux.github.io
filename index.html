<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW NINJA</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#02040a;

  touch-action:none;

  font-family:Arial,sans-serif;

}

canvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

}

#menu{

  position:fixed;

  inset:0;

  z-index:10;

  display:flex;

  align-items:center;

  justify-content:center;

  background:radial-gradient(circle,#13233b,#02040a 70%);

}

.box{

  width:88%;

  max-width:480px;

  padding:30px;

  text-align:center;

  border:2px solid #00eaff;

  border-radius:24px;

  background:#030817ee;

  box-shadow:0 0 35px #00eaff55;

}

h1{

  color:white;

  font-size:46px;

  line-height:.95;

  letter-spacing:4px;

  text-shadow:0 0 20px #00eaff;

}

.sub{

  color:#00eaff;

  margin:15px 0 25px;

  letter-spacing:5px;

}

#start{

  width:100%;

  padding:18px;

  border:0;

  border-radius:14px;

  background:linear-gradient(90deg,#00d9ff,#765cff);

  color:white;

  font-size:20px;

  font-weight:bold;

}

#hud{

  display:none;

  position:fixed;

  z-index:5;

  top:12px;

  left:12px;

  right:12px;

  justify-content:space-between;

  pointer-events:none;

  color:white;

}

.hud{

  background:#050b18dd;

  border:1px solid #00eaff77;

  border-radius:12px;

  padding:9px 12px;

}

#hpbar{

  width:140px;

  height:9px;

  margin-top:5px;

  background:#222;

  border-radius:8px;

  overflow:hidden;

}

#hp{

  width:100%;

  height:100%;

  background:#ff3972;

}

#controls{

  display:none;

  position:fixed;

  z-index:6;

  inset:0;

  pointer-events:none;

}

.btn{

  position:absolute;

  width:68px;

  height:68px;

  border-radius:50%;

  border:2px solid #ffffff33;

  background:#061027dd;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:bold;

  pointer-events:auto;

}

#left{

  left:15px;

  bottom:18px;

}

#right{

  left:95px;

  bottom:18px;

}

#jump{

  right:100px;

  bottom:18px;

  color:#00eaff;

}

#attack{

  right:15px;

  bottom:18px;

  color:#ff3972;

}

#dash{

  right:58px;

  bottom:96px;

  width:54px;

  height:54px;

  font-size:11px;

  color:#a878ff;

}

#skills{

  display:none;

  position:fixed;

  z-index:7;

  right:15px;

  bottom:170px;

  gap:7px;

}

.skill{

  width:58px;

  height:43px;

  border:2px solid #00eaff;

  border-radius:11px;

  background:#061027ee;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:10px;

  font-weight:bold;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="box">

    <h1>SHADOW<br>NINJA</h1>

    <div class="sub">NEON RISE</div>

    <button id="start">START MISSION</button>

  </div>

</div>

<div id="hud">

  <div class="hud">

    HP

    <div id="hpbar">

      <div id="hp"></div>

    </div>

  </div>

  <div class="hud">

    SCORE <span id="score">0</span>

  </div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="jump">↑</div>

  <div class="btn" id="attack">⚔</div>

  <div class="btn" id="dash">DASH</div>

</div>

<div id="skills">

  <div class="skill" id="skill1">SLASH</div>

  <div class="skill" id="skill2">SHURIKEN</div>

  <div class="skill" id="skill3">ULT</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;

function resize(){

  W=innerWidth;

  H=innerHeight;

  canvas.width=W;

  canvas.height=H;

}

addEventListener("resize",resize);

resize();

const keys={

  left:false,

  right:false,

  jump:false,

  attack:false,

  dash:false

};

function bindButton(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",function(e){

    e.preventDefault();

    keys[key]=true;

  });

  b.addEventListener("pointerup",function(e){

    e.preventDefault();

    keys[key]=false;

  });

  b.addEventListener("pointercancel",function(){

    keys[key]=false;

  });

  b.addEventListener("pointerleave",function(){

    keys[key]=false;

  });

}

bindButton("left","left");

bindButton("right","right");

bindButton("jump","jump");

bindButton("attack","attack");

bindButton("dash","dash");

addEventListener("keydown",function(e){

  if(e.code==="ArrowLeft")keys.left=true;

  if(e.code==="ArrowRight")keys.right=true;

  if(e.code==="ArrowUp"||e.code==="Space")keys.jump=true;

  if(e.code==="KeyJ")keys.attack=true;

  if(e.code==="ShiftLeft")keys.dash=true;

  if(e.code==="Digit1")useSlash();

  if(e.code==="Digit2")useShuriken();

  if(e.code==="Digit3")useUltimate();

});

addEventListener("keyup",function(e){

  if(e.code==="ArrowLeft")keys.left=false;

  if(e.code==="ArrowRight")keys.right=false;

  if(e.code==="ArrowUp"||e.code==="Space")keys.jump=false;

  if(e.code==="KeyJ")keys.attack=false;

  if(e.code==="ShiftLeft")keys.dash=false;

});

let running=false;

let cameraX=0;

let score=0;

let platforms=[];

let walls=[];

let enemies=[];

let particles=[];

let effects=[];

let boss=null;

let bossDefeated=false;

let shake=0;

let flash=0;

const player={

  x:100,

  y:200,

  w:40,

  h:60,

  vx:0,

  vy:0,

  speed:7,

  hp:100,

  ground:false,

  wall:false,

  direction:1,

  attack:0,

  dash:0,

  invincible:0,

  anim:0,

  combo:1

};

let slashCooldown=0;

let shurikenCooldown=0;

let ultimateCooldown=0;

/* =========================

   WORLD

========================= */

function createWorld(){

  platforms=[];

  walls=[];

  enemies=[];

  for(let i=-10;i<300;i++){

    const x=i*280;

    const y=

      H-100-

      (Math.abs(i)%5)*30;

    platforms.push({

      x:x,

      y:y,

      w:235+(i%3)*25,

      h:35

    });

    if(i>2 && i%4===0){

      walls.push({

        x:x+180,

        y:y-250,

        w:28,

        h:250

      });

    }

    if(i>1 && i%2===0){

      enemies.push({

        x:x+120,

        y:y-58,

        w:42,

        h:58,

        hp:70,

        maxHp:70,

        speed:1.2,

        attack:0

      });

    }

  }

}

/* =========================

   PARTICLES

========================= */

function particle(x,y,type){

  particles.push({

    x:x,

    y:y,

    vx:(Math.random()-.5)*8,

    vy:(Math.random()-.5)*8,

    life:30,

    type:type||"normal"

  });

}

function updateParticles(){

  for(const p of particles){

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.12;

    p.life--;

  }

  particles=particles.filter(p=>p.life>0);

}

/* =========================

   SKILLS

========================= */

function useSlash(){

  if(slashCooldown>0)return;

  slashCooldown=55;

  player.attack=18;

  player.vx=player.direction*12;

  for(let i=0;i<12;i++){

    effects.push({

      x:player.x+player.direction*45,

      y:player.y+25,

      vx:player.direction*(3+Math.random()*5),

      vy:(Math.random()-.5)*5,

      life:28,

      type:"slash"

    });

  }

}

function useShuriken(){

  if(shurikenCooldown>0)return;

  shurikenCooldown=90;

  effects.push({

    x:player.x+player.direction*35,

    y:player.y+22,

    vx:player.direction*13,

    vy:0,

    life:100,

    type:"shuriken"

  });

}

function useUltimate(){

  if(ultimateCooldown>0)return;

  ultimateCooldown=300;

  player.invincible=100;

  shake=18;

  flash=15;

  for(let i=0;i<60;i++){

    effects.push({

      x:player.x+(Math.random()-.5)*300,

      y:player.y+(Math.random()-.5)*180,

      vx:(Math.random()-.5)*12,

      vy:(Math.random()-.5)*12,

      life:60,

      type:"ult"

    });

  }

  for(const e of enemies){

    if(Math.abs(e.x-player.x)<300){

      e.hp-=150;

    }

  }

  if(boss && Math.abs(boss.x-player.x)<350){

    boss.hp-=250;

  }

}

document.getElementById("skill1")

.addEventListener("pointerdown",useSlash);

document.getElementById("skill2")

.addEventListener("pointerdown",useShuriken);

document.getElementById("skill3")

.addEventListener("pointerdown",useUltimate);

/* =========================

   PLAYER

========================= */

function checkWall(){

  player.wall=false;

  for(const w of walls){

    if(

      player.x+player.w>w.x &&

      player.x<w.x+w.w &&

      player.y+player.h>w.y &&

      player.y<w.y+w.h

    ){

      player.wall=true;

      return;

    }

  }

}

function updatePlayer(){

  let move=0;

  if(keys.left)move--;

  if(keys.right)move++;

  if(move){

    player.vx+=move*.8;

    player.direction=move;

    player.anim+=.3;

  }else{

    player.vx*=.82;

  }

  player.vx=

    Math.max(-8,Math.min(8,player.vx));

  checkWall();

  if(

    player.wall &&

    !player.ground

  ){

    if(player.vy>2)

      player.vy=2;

    if(keys.jump)

      player.vy=-7;

  }

  if(

    keys.jump &&

    player.ground

  ){

    player.vy=-15;

    player.ground=false;

  }

  if(

    keys.jump &&

    player.wall

  ){

    player.vy=-13;

    player.vx=-player.direction*9;

  }

  if(

    keys.dash &&

    player.dash<=0

  ){

    player.vx=player.direction*17;

    player.vy*=.2;

    player.dash=14;

    player.invincible=30;

    for(let i=0;i<15;i++)

      particle(player.x,player.y+30,"dash");

  }

  if(

    keys.attack &&

    player.attack<=0

  ){

    player.attack=14;

  }

  if(player.attack>0)player.attack--;

  if(player.dash>0)player.dash--;

  if(player.invincible>0)player.invincible--;

  if(slashCooldown>0)slashCooldown--;

  if(shurikenCooldown>0)shurikenCooldown--;

  if(ultimateCooldown>0)ultimateCooldown--;

  player.vy+=player.wall?.18:.7;

  player.x+=player.vx;

  player.y+=player.vy;

  player.ground=false;

  for(const p of platforms){

    if(

      player.x+player.w>p.x &&

      player.x<p.x+p.w &&

      player.y+player.h>=p.y &&

      player.y+player.h<=p.y+25 &&

      player.vy>=0

    ){

      player.y=p.y-player.h;

      player.vy=0;

      player.ground=true;

    }

  }

  for(const w of walls){

    if(

      player.x+player.w>w.x &&

      player.x<w.x+w.w &&

      player.y+player.h>w.y &&

      player.y<w.y+w.h

    ){

      if(player.vx>0)

        player.x=w.x-player.w;

      if(player.vx<0)

        player.x=w.x+w.w;

    }

  }

  cameraX=player.x-W*.35;

  /* 떨어졌을 때 */

  if(player.y>H+300){

    player.hp-=20;

    player.y=100;

    player.vy=0;

  }

}

/* =========================

   ENEMIES

========================= */

function updateEnemies(){

  for(const e of [...enemies]){

    const dx=player.x-e.x;

    const d=Math.abs(dx);

    if(d<550){

      e.x+=Math.sign(dx)*e.speed;

    }

    if(e.attack>0)

      e.attack--;

    if(

      d<65 &&

      Math.abs(player.y-e.y)<70 &&

      e.attack<=0

    ){

      if(player.invincible<=0){

        player.hp-=10;

        player.invincible=40;

        flash=8;

      }

      e.attack=60;

    }

    if(

      player.attack>0 &&

      d<100 &&

      Math.abs(player.y-e.y)<80

    ){

      e.hp-=25;

    }

    for(const s of effects){

      if(

        s.type==="slash" &&

        Math.abs(s.x-e.x)<60 &&

        Math.abs(s.y-e.y)<70

      ){

        e.hp-=5;

      }

      if(

        s.type==="shuriken" &&

        Math.abs(s.x-e.x)<45 &&

        Math.abs(s.y-e.y)<55

      ){

        e.hp-=45;

        s.life=0;

      }

    }

    if(e.hp<=0){

      score+=150;

      for(let i=0;i<15;i++)

        particle(e.x,e.y);

      enemies.splice(

        enemies.indexOf(e),

        1

      );

    }

  }

}

/* =========================

   BOSS

========================= */

function spawnBoss(){

  if(boss || bossDefeated)return;

  boss={

    x:player.x+700,

    y:H-205,

    w:85,

    h:110,

    hp:1000,

    maxHp:1000,

    speed:1.8,

    attack:80,

    skill:150,

    phase:1

  };

}

function updateBoss(){

  if(!boss)return;

  const dx=player.x-boss.x;

  const d=Math.abs(dx);

  if(d>100)

    boss.x+=Math.sign(dx)*boss.speed;

  if(boss.attack>0)boss.attack--;

  if(boss.skill>0)boss.skill--;

  if(

    d<110 &&

    Math.abs(player.y-boss.y)<110 &&

    boss.attack<=0

  ){

    if(player.invincible<=0){

      player.hp-=20;

      player.invincible=50;

      flash=12;

      shake=10;

    }

    boss.attack=65;

  }

  if(

    boss.skill<=0

  ){

    bossSkill();

    boss.skill=

      boss.phase===2?100:170;

  }

  if(

    player.attack>0 &&

    d<120 &&

    Math.abs(player.y-boss.y)<120

  ){

    boss.hp-=20;

  }

  if(boss.hp<500){

    boss.phase=2;

    boss.speed=2.7;

  }

  if(boss.hp<=0){

    score+=5000;

    bossDefeated=true;

    shake=30;

    flash=30;

    for(let i=0;i<100;i++)

      particle(boss.x,boss.y,"boss");

    boss=null;

    setTimeout(function(){

      alert(

        "SHOGUN ZERO DEFEATED!\nSCORE: "+score

      );

    },100);

  }

}

function bossSkill(){

  if(!boss)return;

  const choice=

    Math.floor(Math.random()*3);

  if(choice===0){

    boss.x+=

      Math.sign(player.x-boss.x)*100;

    shake=12;

  }

  if(choice===1){

    const dir=

      Math.sign(player.x-boss.x);

    for(let i=0;i<5;i++){

      effects.push({

        x:boss.x,

        y:boss.y+40,

        vx:dir*(7+i),

        vy:(i-2)*.5,

        life:100,

        type:"boss"

      });

    }

  }

  if(choice===2){

    flash=12;

    shake=15;

    if(

      Math.abs(player.x-boss.x)<350 &&

      player.invincible<=0

    ){

      player.hp-=30;

      player.invincible=60;

    }

  }

}

/* =========================

   EFFECTS

========================= */

function updateEffects(){

  for(const s of effects){

    s.x+=s.vx;

    s.y+=s.vy;

    s.life--;

    if(s.type==="boss")

      s.vy+=.02;

  }

  effects=effects.filter(s=>s.life>0);

}

function drawEffects(){

  for(const s of effects){

    ctx.save();

    ctx.translate(

      s.x-cameraX,

      s.y

    );

    if(s.type==="slash"){

      ctx.strokeStyle="#00eaff";

      ctx.shadowBlur=20;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(

        0,0,38,-.9,.9

      );

      ctx.stroke();

    }

    if(s.type==="shuriken"){

      ctx.strokeStyle="white";

      ctx.shadowBlur=15;

      ctx.shadowColor="#00eaff";

      ctx.lineWidth=4;

      ctx.rotate(Date.now()*.02);

      for(let i=0;i<4;i++){

        ctx.rotate(Math.PI/2);

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(24,0);

        ctx.stroke();

      }

    }

    if(s.type==="ult"){

      ctx.fillStyle="#00eaff";

      ctx.shadowBlur=25;

      ctx.shadowColor="#00eaff";

      ctx.beginPath();

      ctx.arc(

        0,0,

        7+s.life*.35,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    if(s.type==="boss"){

      ctx.fillStyle="#ff3972";

      ctx.shadowBlur=20;

      ctx.shadowColor="#ff3972";

      ctx.beginPath();

      ctx.arc(

        0,0,9,0,Math.PI*2

      );

      ctx.fill();

    }

    ctx.restore();

  }

}

/* =========================

   DRAW BACKGROUND

========================= */

function drawBackground(){

  const g=

    ctx.createLinearGradient(

      0,0,0,H

    );

  g.addColorStop(0,"#050817");

  g.addColorStop(1,"#150d24");

  ctx.fillStyle=g;

  ctx.fillRect(0,0,W,H);

  /* 달 */

  ctx.fillStyle="#dfffff";

  ctx.shadowBlur=30;

  ctx.shadowColor="#00eaff";

  ctx.beginPath();

  ctx.arc(

    W*.78,

    85,

    35,

    0,

    Math.PI*2

  );

  ctx.fill();

  ctx.shadowBlur=0;

  /* 도시 */

  for(let i=0;i<30;i++){

    const x=

      ((i*150-cameraX*.18)%

      (W+300))-150;

    const h=

      100+(i*67)%280;

    ctx.fillStyle=

      i%3===0

      ?"#0b1830"

      :"#080d20";

    ctx.fillRect(

      x,

      H-90-h,

      90,

      h

    );

  }

}

/* =========================

   DRAW WORLD

========================= */

function drawWorld(){

  for(const p of platforms){

    ctx.fillStyle="#0b1529";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      p.w,

      p.h

    );

    ctx.fillStyle="#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      p.w,

      3

    );

  }

  for(const w of walls){

    ctx.fillStyle="#090d1c";

    ctx.fillRect(

      w.x-cameraX,

      w.y,

      w.w,

      w.h

    );

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.shadowBlur=12;

    ctx.shadowColor="#00eaff";

    ctx.strokeRect(

      w.x-cameraX,

      w.y,

      w.w,

      w.h

    );

    ctx.shadowBlur=0;

  }

}

/* =========================

   DRAW ENEMIES

========================= */

function drawEnemies(){

  for(const e of enemies){

    const x=e.x-cameraX;

    const y=e.y;

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle="#06080e";

    ctx.fillRect(

      5,20,32,38

    );

    ctx.beginPath();

    ctx.arc(

      21,14,16,

      0,Math.PI*2

    );

    ctx.fill();

    ctx.fillStyle="#ff3972";

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff3972";

    ctx.fillRect(

      9,10,9,4

    );

    ctx.fillRect(

      24,10,9,4

    );

    ctx.shadowBlur=0;

    ctx.strokeStyle="#ff3972";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(31,30);

    ctx.lineTo(55,7);

    ctx.stroke();

    ctx.fillStyle="#222";

    ctx.fillRect(

      0,-12,42,5

    );

    ctx.fillStyle="#ff3972";

    ctx.fillRect(

      0,-12,

      42*(e.hp/e.maxHp),

      5

    );

    ctx.restore();

  }

}

/* =========================

   DRAW BOSS

========================= */

function drawBoss(){

  if(!boss)return;

  const x=boss.x-cameraX;

  const y=boss.y;

  ctx.save();

  ctx.translate(x,y);

  ctx.globalAlpha=.15;

  ctx.fillStyle=

    boss.phase===2

    ?"#ff3972"

    :"#8c5cff";

  ctx.shadowBlur=50;

  ctx.shadowColor=

    boss.phase===2

    ?"#ff3972"

    :"#8c5cff";

  ctx.beginPath();

  ctx.arc(

    42,55,75,

    0,Math.PI*2

  );

  ctx.fill();

  ctx.globalAlpha=1;

  ctx.shadowBlur=0;

  ctx.fillStyle="#04060b";

  ctx.fillRect(

    8,32,68,72

  );

  ctx.strokeStyle=

    boss.phase===2

    ?"#ff3972"

    :"#8c5cff";

  ctx.lineWidth=3;

  ctx.strokeRect(

    8,32,68,72

  );

  ctx.beginPath();

  ctx.arc(

    42,25,30,

    0,Math.PI*2

  );

  ctx.fill();

  ctx.stroke();

  ctx.fillStyle=

    boss.phase===2

    ?"#ff3972"

    :"#a88cff";

  ctx.shadowBlur=20;

  ctx.shadowColor=

    boss.phase===2

    ?"#ff3972"

    :"#a88cff";

  ctx.fillRect(

    19,21,16,5

  );

  ctx.fillRect(

    49,21,16,5

  );

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";

  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(70,58);

  ctx.lineTo(120,5);

  ctx.stroke();

  ctx.strokeStyle=

    boss.phase===2

    ?"#ff3972"

    :"#8c5cff";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(70,58);

  ctx.lineTo(120,5);

  ctx.stroke();

  ctx.restore();

  /* 보스 체력 */

  const bw=Math.min(W*.7,520);

  const bx=(W-bw)/2;

  const by=70;

  ctx.fillStyle="#240814";

  ctx.fillRect(

    bx,by,bw,15

  );

  ctx.fillStyle=

    boss.phase===2

    ?"#ff3972"

    :"#8c5cff";

  ctx.fillRect(

    bx,

    by,

    bw*(boss.hp/boss.maxHp),

    15

  );

  ctx.strokeStyle="#ffffff55";

  ctx.strokeRect(

    bx,by,bw,15

  );

  ctx.fillStyle="white";

  ctx.font="bold 13px Arial";

  ctx.textAlign="center";

  ctx.fillText(

    "SHOGUN ZERO  PHASE "+boss.phase,

    W/2,

    by-7

  );

}

/* =========================

   DRAW PLAYER

========================= */

function drawPlayer(){

  ctx.save();

  ctx.translate(

    player.x-cameraX,

    player.y

  );

  if(player.direction<0)

    ctx.scale(-1,1);

  if(

    player.invincible>0 &&

    Math.floor(player.invincible/4)%2===0

  ){

    ctx.globalAlpha=.35;

  }

  const run=

    player.ground &&

    Math.abs(player.vx)>.5

    ?Math.sin(player.anim)*5

    :0;

  /* 대시 잔상 */

  if(player.dash>0){

    for(let i=1;i<5;i++){

      ctx.globalAlpha=.12;

      ctx.fillStyle="#00eaff";

      ctx.beginPath();

      ctx.arc(

        -i*14,

        28,

        18,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

    ctx.globalAlpha=1;

  }

  /* 다리 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=10;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(12,42);

  ctx.lineTo(7+run,58);

  ctx.moveTo(27,42);

  ctx.lineTo(32-run,58);

  ctx.stroke();

  /* 청록 라인 */

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(12,42);

  ctx.lineTo(7+run,58);

  ctx.moveTo(27,42);

  ctx.lineTo(32-run,58);

  ctx.stroke();

  /* 몸 */

  ctx.fillStyle="#020306";

  ctx.fillRect(

    5,18,28,29

  );

  ctx.strokeStyle="#00eaff";

  ctx.strokeRect(

    5,18,28,29

  );

  /* 팔 */

  ctx.strokeStyle="#020306";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(8,23);

  ctx.lineTo(-6,34+run);

  ctx.moveTo(30,23);

  ctx.lineTo(43,34-run);

  ctx.stroke();

  /* 머리 */

  ctx.fillStyle="#020306";

  ctx.beginPath();

  ctx.arc(

    19,13,17,

    0,Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.stroke();

  /* 눈 */

  ctx.fillStyle="#8fffff";

  ctx.shadowBlur=15;

  ctx.shadowColor="#00eaff";

  ctx.fillRect(

    8,10,8,4

  );

  ctx.fillRect(

    22,10,8,4

  );

  ctx.shadowBlur=0;

  /* 스카프 */

  ctx.fillStyle="#00cfff";

  ctx.beginPath();

  ctx.moveTo(5,21);

  ctx.lineTo(-14,26);

  ctx.lineTo(-30,38);

  ctx.lineTo(-7,30);

  ctx.fill();

  /* 검 */

  ctx.strokeStyle="white";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(29,28);

  ctx.lineTo(58,2);

  ctx.stroke();

  ctx.strokeStyle="#00eaff";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(29,28);

  ctx.lineTo(58,2);

  ctx.stroke();

  /* 공격 */

  if(player.attack>0){

    ctx.strokeStyle="#00eaff";

    ctx.shadowBlur=25;

    ctx.shadowColor="#00eaff";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(

      25,

      28,

      50,

      -.9,

      .8

    );

    ctx.stroke();

    ctx.shadowBlur=0;

  }

  /* 벽타기 효과 */

  if(player.wall){

    ctx.strokeStyle="#00eaff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(-8,15);

    ctx.lineTo(-18,8);

    ctx.moveTo(-8,28);

    ctx.lineTo(-20,22);

    ctx.stroke();

  }

  ctx.restore();

}

/* =========================

   DRAW PARTICLES

========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=

      p.life/30;

    ctx.fillStyle=

      p.type==="boss"

      ?"#ff3972"

      :"#00eaff";

    ctx.fillRect(

      p.x-cameraX,

      p.y,

      5,

      5

    );

  }

  ctx.globalAlpha=1;

}

/* =========================

   GAME UPDATE

========================= */

function update(){

  if(!running)return;

  updatePlayer();

  updateEnemies();

  updateBoss();

  updateEffects();

  updateParticles();

  /* 보스 등장 */

  if(

    player.x>5000 &&

    !boss &&

    !bossDefeated

  ){

    spawnBoss();

  }

  score=Math.max(

    score,

    Math.floor(player.x/10)

  );

  document.getElementById(

    "score"

  ).textContent=score;

  document.getElementById(

    "hp"

  ).style.width=

    Math.max(0,player.hp)+"%";

  document.getElementById(

    "skill1"

  ).textContent=

    slashCooldown>0

    ?Math.ceil(slashCooldown/60)

    :"SLASH";

  document.getElementById(

    "skill2"

  ).textContent=

    shurikenCooldown>0

    ?Math.ceil(shurikenCooldown/60)

    :"SHURIKEN";

  document.getElementById(

    "skill3"

  ).textContent=

    ultimateCooldown>0

    ?Math.ceil(ultimateCooldown/60)

    :"ULT";

  if(shake>0)

    shake*=.88;

  if(flash>0)

    flash--;

  if(player.hp<=0){

    running=false;

    setTimeout(function(){

      alert("MISSION FAILED!");

      location.reload();

    },50);

  }

}

/* =========================

   GAME DRAW

========================= */

function draw(){

  ctx.save();

  if(shake>0){

    ctx.translate(

      (Math.random()-.5)*shake,

      (Math.random()-.5)*shake

    );

  }

  drawBackground();

  drawWorld();

  drawEnemies();

  drawBoss();

  drawEffects();

  drawPlayer();

  drawParticles();

  ctx.restore();

  if(flash>0){

    ctx.fillStyle=

      "rgba(255,0,70,.12)";

    ctx.fillRect(

      0,0,W,H

    );

  }

}

/* =========================

   START

========================= */

document.getElementById(

  "start"

).addEventListener(

  "click",

  function(){

    running=true;

    createWorld();

    document.getElementById(

      "menu"

    ).style.display="none";

    document.getElementById(

      "hud"

    ).style.display="flex";

    document.getElementById(

      "controls"

    ).style.display="block";

    document.getElementById(

      "skills"

    ).style.display="flex";

  }

);

/* =========================

   START LOOP

========================= */

createWorld();

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
